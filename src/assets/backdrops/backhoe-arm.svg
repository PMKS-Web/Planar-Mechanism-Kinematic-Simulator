<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <!--
    The machine the Backhoe Bucket template is a linkage of, drawn as the sort
    of side elevation somebody would put behind a grid and trace.

    Laid out so that a model point (mx, my), in centimeters, lands at
    ((mx + 7.3) * 100, (4.1 - my) * 100) — which puts the template's own joints
    on the pins drawn here when the picture is placed 16 cm wide at (-0.7, 0.1).
    Move the picture and the mechanism stays put; that is the whole point of a
    backdrop.
  -->
  <defs>
    <style>
      .body { fill: #dfe4ee; stroke: #3d4a63; stroke-width: 5; }
      .arm { fill: #eef1f7; stroke: #3d4a63; stroke-width: 6; stroke-linejoin: round; }
      .ram { fill: #cfd6e4; stroke: #3d4a63; stroke-width: 5; }
      .pin { fill: #ffffff; stroke: #3d4a63; stroke-width: 5; }
      .rule { fill: none; stroke: #8a93a8; stroke-width: 3; stroke-dasharray: 14 12; }
      .dirt { fill: none; stroke: #6f7a90; stroke-width: 4; }
    </style>
  </defs>

  <!-- Ground, and the spoil the bucket is working -->
  <path class="dirt" d="M0 560 H1120" />
  <path class="dirt" d="M1120 560 q 90 -14 150 40 q 80 54 190 30 H1600" />

  <!-- Tractor body, sitting behind the boom's ground pin -->
  <path class="body" d="M-10 560 V400 q0 -26 26 -26 H150 l30 -58 h150 l16 58 h120 q26 0 26 26 V560 Z" />
  <circle class="body" cx="90" cy="560" r="58" />
  <circle class="body" cx="330" cy="560" r="72" />
  <circle class="pin" cx="90" cy="560" r="20" />
  <circle class="pin" cx="330" cy="560" r="20" />

  <!-- The ram's anchor on the body, at model (-7, 0) -->
  <circle class="pin" cx="30" cy="410" r="17" />

  <!-- Hydraulic ram, reaching from the body to the boom's lug -->
  <g transform="rotate(-8.6 30 410)">
    <rect class="ram" x="30" y="382" width="380" height="56" rx="18" />
    <rect class="ram" x="380" y="396" width="180" height="28" rx="12" />
  </g>
  <circle class="pin" cx="592" cy="326" r="15" />

  <!-- Boom: the ground pin at model (0, 0), the lug at (-1.12, 2.78), the elbow at (2, 1.2) -->
  <path class="arm" d="M700 452 q-34 -40 -12 -84 l-30 -210 q-4 -30 26 -34 l52 -6 q28 -4 34 24 l40 200 l128 -48 q28 -10 40 18 l16 42 q10 28 -18 38 l-176 66 q-42 16 -74 -6 Z" />
  <circle class="pin" cx="730" cy="410" r="19" />
  <circle class="pin" cx="618" cy="132" r="16" />
  <circle class="pin" cx="930" cy="290" r="17" />

  <!-- Dipper: elbow at (2, 1.2) down to the bucket hanger at (4.82, 0.17) -->
  <path class="arm" d="M912 258 l282 106 q26 10 16 38 l-14 38 q-10 28 -38 18 l-282 -106 q-26 -10 -16 -38 l14 -38 q10 -28 38 -18 Z" />
  <circle class="pin" cx="1212" cy="393" r="17" />

  <!-- The tipping link's ground pin at (3.2, -1.6) -->
  <circle class="pin" cx="1050" cy="570" r="15" />

  <!-- Bucket, hung on K and reaching to the tooth at (5.6, -2.6) -->
  <path class="arm" d="M1212 393 l60 -30 q30 -14 44 16 q52 112 6 210 q-16 34 -52 40 l-42 8 l64 -74 q30 -78 -20 -142 Z" />
  <path class="arm" d="M1196 420 q86 34 106 132 q10 48 -12 118 l-72 -22 q26 -74 6 -140 q-18 -58 -74 -78 Z" />
  <circle class="pin" cx="1290" cy="670" r="13" />

  <!-- The arc the tooth sweeps, which is what the linkage is drawn to check -->
  <path class="rule" d="M1290 670 q-190 -120 -196 -330" />
</svg>
