<div
  data-canvas-inset="top"
  class="topStrip"
  #strip
  [class]="'topStrip fit' + labelLevel"
  [class.devMode]="isDevMode()"
>
  <div class="card brandCard">
    <button
      class="iconButton"
      [class.on]="menuOpen"
      (click)="toggleMenu($event)"
      matTooltip="Project menu"
      aria-label="Project menu"
      aria-controls="projectMenu"
      [attr.aria-expanded]="menuOpen"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <img class="logo" alt="PMKS+" src="assets/PMKS_logo.png" />
  </div>

  <div class="card tabCard">
    <div class="tabStrip" #tabStrip>
      <!-- One highlight for all four modes, so it slides between them instead
           of blinking from one to the next. -->
      <div
        class="activeTabPill"
        [class.hidden]="!highlight.visible"
        [style.transform]="'translateX(' + highlight.left + 'px)'"
        [style.width.px]="highlight.width"
      ></div>

      <!-- The tip on the whole button, as the analysis tabs have it: on the
           icon alone it answered only a pointer over the glyph, and a reader
           resting on the word got nothing. -->
      <button
        class="tabButton"
        [class.active]="isActive(TabID.SYNTHESIZE)"
        (click)="select(TabID.SYNTHESIZE)"
        aria-label="Synthesis"
        appShortcutTip="Synthesis"
        shortcutTipFor="mode.synthesis"
      >
        <mat-icon svgIcon="synthesis"></mat-icon>
        <span class="tabLabel">Synthesis</span>
      </button>

      <button
        class="tabButton"
        [class.active]="isActive(TabID.EDIT)"
        (click)="select(TabID.EDIT)"
        aria-label="Edit"
        appShortcutTip="Edit"
        shortcutTipFor="mode.edit"
      >
        <mat-icon svgIcon="edit_outline"></mat-icon>
        <span class="tabLabel">Edit</span>
      </button>

      <div class="modeDivider"></div>

      <!-- One control per analysis mode, doing all three things a press can
           mean (`select`). The chip is a plain <span> inside it: a label, not a
           second control -- an interactive descendant of a <button> is invalid
           ARIA, a screen reader flattens it into the parent's name, and it
           answered only the mouse. The count is spoken as part of the button's
           own name instead, and the tooltip says when a press opens the setup
           rather than switching mode. -->
      <button
        class="tabButton"
        [class.active]="isActive(TabID.ANALYZE)"
        [class.notReady]="!canAnalyze(TabID.ANALYZE)"
        (click)="select(TabID.ANALYZE)"
        [attr.aria-label]="nameOf(TabID.ANALYZE, 'Kinematic Analysis')"
        [appShortcutTip]="tipFor(TabID.ANALYZE, 'Kinematic Analysis')"
        shortcutTipFor="mode.kinematic"
      >
        <mat-icon>query_stats</mat-icon>
        <span class="tabLabel long">Kinematic Analysis</span>
        <span class="tabLabel short">Kinematic</span>
        <!-- Nothing drawn, nothing to be ready for. -->
        @if (hasStatus()) {
          <span class="chip" [class]="statusOf(TabID.ANALYZE).kind">{{
            statusOf(TabID.ANALYZE).text
          }}</span>
        }
      </button>

      <button
        class="tabButton"
        [class.active]="isActive(TabID.FORCE)"
        [class.notReady]="!canAnalyze(TabID.FORCE)"
        (click)="select(TabID.FORCE)"
        [attr.aria-label]="nameOf(TabID.FORCE, 'Force Analysis')"
        [appShortcutTip]="tipFor(TabID.FORCE, 'Force Analysis')"
        shortcutTipFor="mode.force"
      >
        <mat-icon>balance</mat-icon>
        <span class="tabLabel long">Force Analysis</span>
        <span class="tabLabel short">Force</span>
        <!-- Nothing drawn, nothing to be ready for. -->
        @if (hasStatus()) {
          <span class="chip" [class]="statusOf(TabID.FORCE).kind">{{
            statusOf(TabID.FORCE).text
          }}</span>
        }
      </button>
    </div>
  </div>

  <!-- The same corner in every mode. Undo and Redo are always here now, because
       an analysis mode can be edited: unlocking drags without them would strand
       a bad drag behind a mode switch. Export joins them where there is a
       solved cycle to take away, sliding in from the right so the two that were
       already there keep their place rather than being pushed about. -->
  <div class="card historyCard">
    <button
      class="historyButton"
      (click)="undo()"
      [disabled]="!canUndo()"
      appShortcutTip="Undo"
      shortcutTipFor="history.undo"
      aria-label="Undo"
    >
      <mat-icon>undo</mat-icon>
      <span class="historyLabel">Undo</span>
    </button>
    <button
      class="historyButton"
      (click)="redo()"
      [disabled]="!canRedo()"
      appShortcutTip="Redo"
      shortcutTipFor="history.redo"
      aria-label="Redo"
    >
      <mat-icon>redo</mat-icon>
      <span class="historyLabel">Redo</span>
    </button>
    @if (tabs.isAnalysisMode()) {
      <!-- One slot rather than two entering elements: the card has to *grow* as
           this arrives, and it can only grow leftwards because it is pinned to
           the window's right edge. Animating the slot's own width is what makes
           that growth part of the same movement -- with the button alone
           entering, the card snapped to its full width in one frame and threw
           Undo and Redo 200px to the left before anything had slid anywhere. -->
      <span class="exportSlot" @slideInFromRight>
        <span class="historyRule" aria-hidden="true"></span>
        <button
          class="historyButton"
          (click)="exportData()"
          [disabled]="!canExport()"
          [matTooltip]="exportTooltip()"
          aria-label="Export data"
        >
          <mat-icon>download</mat-icon>
          <span class="historyLabel">Export data</span>
        </button>
      </span>
    }
  </div>
</div>

@if (menuOpen) {
  <div class="menuScrim" (click)="closeMenu()"></div>
  <div
    class="projectMenu"
    id="projectMenu"
    #projectMenu
    [class.byKeyboard]="menuByKeyboard"
    (keydown)="onMenuKey($event)"
    @menuOpen
  >
    <button class="menuItem" (click)="newProject()">
      <mat-icon>note_add</mat-icon>New project
    </button>
    <input #fileInput hidden type="file" accept="text" (change)="upload($event)" />
    <button class="menuItem" (click)="fileInput.click()"><mat-icon>file_open</mat-icon>Open</button>
    <button class="menuItem" id="templatesButton" (click)="openTemplates()">
      <mat-icon>apps</mat-icon>Mechanism Library
    </button>
    <button class="menuItem" (click)="downloadLinkage()"><mat-icon>save</mat-icon>Save</button>
    <button class="menuItem" (click)="copyURL()"><mat-icon>link</mat-icon>Share project</button>
    <button class="menuItem" (click)="exportData()" [disabled]="!canExport()">
      <mat-icon>download</mat-icon>Export data
    </button>
    <button class="menuItem" (click)="exportDrawing()">
      <mat-icon>architecture</mat-icon>CAD export
    </button>
    <div class="menuDivider"></div>
    <button class="menuItem" (click)="openSettings()">
      <mat-icon>settings</mat-icon>Settings
      <kbd class="menuKeys">{{ shortcuts.keysFor('app.settings') }}</kbd>
    </button>
    <button class="menuItem" id="tutorialButton" (click)="openTutorial()">
      <mat-icon>school</mat-icon>Tutorial
    </button>
    <button class="menuItem" id="helpButton" (click)="openHelp()">
      <mat-icon>help</mat-icon>Help and feedback
      <kbd class="menuKeys">{{ shortcuts.keysFor('app.help') }}</kbd>
    </button>
    @if (isDevMode()) {
      <button class="menuItem" (click)="openDebug()"><mat-icon>bug_report</mat-icon>Debug</button>
    }
  </div>
}
