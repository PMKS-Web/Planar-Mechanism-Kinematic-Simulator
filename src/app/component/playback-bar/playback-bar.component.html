<div class="playbackRow">
  @if (tabs.isAnalysisMode()) {
    <div class="card transportCard">
      <button class="speedButton" (click)="cycleSpeed()" [disabled]="!canPlay">{{ speed }}x</button>
      <button
        class="playButton"
        (click)="play()"
        [disabled]="!canPlay"
        [attr.aria-label]="playing ? 'Pause' : 'Play'"
      >
        <mat-icon>{{ playing ? 'pause' : 'play_arrow' }}</mat-icon>
      </button>
    </div>

    <div class="card scrubCard">
      <div class="mechRows">
        @for (row of rows; track row.id) {
          <div class="mechRow">
            <span class="mechChip">{{ row.id }}</span>
            @if (row.ownPlay) {
              <button
                class="rowPlay"
                [class.idle]="!row.playing"
                (click)="toggleRow(row)"
                [attr.aria-label]="row.playing ? 'Pause ' + row.id : 'Play ' + row.id"
              >
                <mat-icon>{{ row.playing ? 'pause' : 'play_arrow' }}</mat-icon>
              </button>
            }
            <input
              class="rowScrubber"
              [id]="row.master ? 'slider' : null"
              type="range"
              min="0"
              max="1000"
              [value]="row.scrub"
              [disabled]="!canPlay"
              (mousedown)="onScrubDown()"
              (mouseup)="onScrubUp()"
              (input)="scrubRow(row, $event)"
            />
            <span class="mechTime">{{ row.time }}</span>
            @if (row.note) {
              <span class="mechNote">{{ row.note }}</span>
            }
            @if (row.isMechanism) {
              <button
                class="iconButton"
                (click)="flipDirection(row)"
                [matTooltip]="row.clockwise ? 'Driven clockwise' : 'Driven counter-clockwise'"
                matTooltipShowDelay="600"
              >
                <mat-icon>{{ row.clockwise ? 'rotate_right' : 'rotate_left' }}</mat-icon>
              </button>
            }
          </div>
        }
      </div>

      <form class="timeForm" (ngSubmit)="field.blur()">
        <input
          id="animationBar-input"
          name="timestep"
          type="text"
          [disabled]="!canPlay"
          [(ngModel)]="timeDisplay"
          (blur)="onTimeSubmit()"
          (click)="field.select()"
          #field
        />
      </form>

      @if (canSync) {
        <button class="syncToggle" (click)="toggleSync()">
          <mat-icon>{{ synced ? 'unfold_more' : 'unfold_less' }}</mat-icon>
          {{ synced ? 'Control each mechanism' : 'Sync all mechanisms' }}
        </button>
      }
    </div>
  }

  <!-- Grows in Edit and collapses in analysis, so the view controls glide from
       the right edge into the centred cluster instead of jumping there. -->
  <div class="clusterSpacer" [class.analysis]="tabs.isAnalysisMode()"></div>

  <app-view-controls></app-view-controls>
</div>
