<div id="hold-field-block" [formGroup]="formGroup()" [class.disabled]="disabled()">
  <!-- One caption for the pair, as the L / angle pair had, and a row for each
       value led by its letter. Only the placement is the pair's; each field
       keeps its own padlock, inside it at the right. -->
  <div class="row head">
    <span class="label" [class.dim]="disabled()">Link Length and Angle</span>
    <mat-icon
      class="label-help"
      matTooltip="The length and angle of this link. Counter-clockwise is positive."
      matTooltipShowDelay="400"
      [class.inert]="disabled()"
      [matTooltipDisabled]="disabled()"
      >help_outline</mat-icon
    >
  </div>
  @for (
    which of [
      { key: 'length', letter: 'L', control: 'length' },
      { key: 'angle', letter: '⊾', control: 'angle' },
    ];
    track which.key
  ) {
    <div class="row field">
      <span class="label" [class.dim]="disabled()" [class.angle-label]="which.key === 'angle'">{{
        which.letter
      }}</span>
      <!-- Hover or focus draws this value's dimension on the canvas, the same
           signal the pair of fields used to send. The padlock is laid over the
           field's right end rather than given to Material as a suffix: the
           panel's fields are thirty pixels tall, and a suffix sits on the text
           baseline, which in a field this short is the underline. -->
      <div
        class="well"
        [class.locked]="held($any(which.key))"
        (mouseenter)="enter($any(which.key))"
        (mouseleave)="leave($any(which.key))"
      >
        <mat-form-field class="customInputForm" (click)="field.select()">
          <input
            class="customInput"
            spellcheck="false"
            matInput
            type="text"
            #field
            [attr.data-hold-field]="which.key"
            (keyup.enter)="field.blur()"
            (focusin)="focus($any(which.key), field)"
            (focusout)="blur($any(which.key))"
            [formControlName]="which.control"
          />
        </mat-form-field>
        @if (holdable()) {
          <!-- The icon states, the word confirms: a locked value says Locked
               beside the closed padlock; an open one is just the padlock, as
               the way to lock it. Typing into a locked field is allowed: the
               number typed becomes the number locked. -->
          <button
            type="button"
            class="padlock"
            [class.on]="held($any(which.key))"
            [attr.data-hold-toggle]="which.key"
            [matTooltip]="padlockTitle($any(which.key))"
            matTooltipShowDelay="400"
            (click)="toggle($any(which.key), $event)"
          >
            @if (held($any(which.key))) {
              <span class="word">Locked</span>
            }
            <svg width="15" height="15" viewBox="0 0 24 24">
              <path
                fill="currentColor"
                fill-rule="evenodd"
                [attr.d]="held($any(which.key)) ? lockPath : unlockPath"
              ></path>
            </svg>
          </button>
        }
      </div>
    </div>
  }
</div>
