<div id="radio-block">
  <div class="row">
    <span class="label"><ng-content></ng-content></span>
    <mat-icon matTooltip="{{ this.tooltip() }}" matTooltipShowDelay="400" class="label-help"
      >help_outline</mat-icon
    >
    <div class="spacer"></div>
  </div>
  <div class="row">
    <!-- The same pill every other pick-one in the app slides; this block only
         binds it to a form control, whose value is the option's index as a
         string, which is what the Material button toggle it replaced wrote. -->
    <segmented-block
      id="radio-buttons"
      [options]="options"
      [selected]="selectedIndex"
      [disabled]="disabled()"
      (selectedChange)="choose($event)"
    ></segmented-block>
  </div>
</div>
