<button
  class="viewButton"
  [class.labelled]="!!caption()"
  [class.grow]="grow()"
  [class.on]="shown()"
  [disabled]="disabled()"
  (click)="pressed.emit()"
  [appShortcutTip]="tip()"
  [shortcutTipFor]="shortcut()"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="noun() ? shown() : null"
>
  @if (icon(); as ligature) {
    <mat-icon [style.color]="ink()">{{ ligature }}</mat-icon>
  } @else {
    <!-- A switch draws whichever of its two glyphs the grid is in; a plain
         action drawn from our own set names one and keeps it. -->
    <mat-icon [svgIcon]="svg() ?? glyph()" [style.color]="ink()"></mat-icon>
  }
  @if (caption(); as word) {
    <span class="viewButtonLabel">{{ word }}</span>
  }
</button>
