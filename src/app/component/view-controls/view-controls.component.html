<div class="viewControls">
  <button
    class="viewButton"
    [class.on]="isShowingCoM()"
    [disabled]="noLinkExists()"
    (click)="showCenterOfMass()"
    matTooltip="Show Center of Mass"
    matTooltipPosition="above"
    [matTooltipShowDelay]="600"
    aria-label="Show Center of Mass"
  >
    <mat-icon svgIcon="{{ comIconName() }}"></mat-icon>
  </button>
  <button
    class="viewButton"
    [class.on]="isShowingIDs()"
    [disabled]="noJointExists()"
    (click)="onShowIDPressed()"
    matTooltip="Show joint IDs"
    matTooltipPosition="above"
    [matTooltipShowDelay]="600"
    aria-label="Show joint IDs"
  >
    <mat-icon svgIcon="{{ idLabelIconName() }}"></mat-icon>
  </button>
  <button
    class="viewButton"
    [class.on]="isShowingTraces()"
    [disabled]="noTracedJoint()"
    (click)="onShowTracesPressed()"
    [matTooltip]="isShowingTraces() ? 'Hide traced paths' : 'Show traced paths'"
    matTooltipPosition="above"
    [matTooltipShowDelay]="600"
    aria-label="Show traced paths"
  >
    <!-- The app's own curve glyph, which is a traced point with its path behind
         it. A line chart reads as another kind of analysis. -->
    <mat-icon svgIcon="{{ traceIconName() }}"></mat-icon>
  </button>
  <button
    class="viewButton"
    (click)="onZoomOutPressed()"
    matTooltip="Zoom Out"
    matTooltipPosition="above"
    [matTooltipShowDelay]="600"
    aria-label="Zoom Out"
  >
    <mat-icon>zoom_out</mat-icon>
  </button>
  <button
    class="viewButton"
    (click)="onZoomInPressed()"
    matTooltip="Zoom In"
    matTooltipPosition="above"
    [matTooltipShowDelay]="600"
    aria-label="Zoom In"
  >
    <mat-icon>zoom_in</mat-icon>
  </button>
  <button
    class="viewButton"
    (click)="onReframePressed()"
    matTooltip="Reset View"
    matTooltipPosition="above"
    [matTooltipShowDelay]="600"
    aria-label="Reset View"
  >
    <mat-icon>crop_free</mat-icon>
  </button>
</div>
