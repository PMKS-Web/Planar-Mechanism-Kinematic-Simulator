<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PMKS+ Web</title>
    <base href="/" />

    <!--
      Keep the app out of search results, and let the landing page have them.

      pmksplus.com is the page written to be found -- it explains what PMKS+ is
      to somebody who has not heard of it. This is the app itself, and the two
      were competing for the same searches while only one of them is an answer
      to them.

      `follow` rather than `noindex, nofollow`: the links out of here still
      count, so whatever this page points at keeps whatever it is owed. And it
      applies to every address the app serves, which is the other half of the
      point -- a shared mechanism is somebody's drawing at a URL a thousand
      characters long, and a branch preview is a build nobody meant to publish.
      Neither belongs in an index.
    -->
    <meta name="robots" content="noindex, follow" />

    <!--
      Without this a phone lays the page out at 980px and scales the result down
      to fit, which is why PMKS+ has always arrived on a phone as a legible
      screenshot of itself rather than an app: every control was drawn at about
      two fifths of its size, putting the mode tabs at roughly 18pt against a
      44pt minimum.

      `viewport-fit=cover`, so the drawing runs edge to edge and under the system
      UI rather than inside a letterbox the browser draws for it. Without it the
      page is held below the status bar and above the home indicator, and every
      `env(safe-area-inset-*)` reads zero -- which on real hardware showed as a
      dead white band above the mode strip and the grid stopping short of the
      bottom of the screen.

      This was deliberately left off until there was hardware to check it on,
      because it costs a safe-area inset on every card that measures itself from
      a window edge. Those are: the mode strip, which takes the top inset into
      its own padding so its text clears the clock; the top strip, which stands
      below it; and the transport, which keeps the bottom inset off the home
      indicator.

      Measured on the hardware afterwards, all four insets read zero in Safari
      with its bars showing -- the page is already laid out inside the safe area
      there, so `viewport-fit` has nothing to cover. It is what a Home Screen
      web app needs, and the four `env()` readers above are what make that one
      work; in a tab they are all reading zero and costing nothing. The canvas
      is a separate matter and takes the large viewport explicitly -- see
      `#canvas` -- because what Safari leaves the page is a hundred points short
      of the screen and the drawing is meant to be the ground, not a panel.

      Zoom is deliberately left enabled. A canvas app is tempting to pin at
      scale 1 because the browser's pinch fights the drawing's own, but taking
      zoom away from a reader who needs it fails WCAG 1.4.4 for everyone in
      order to tidy a gesture. The canvas claims its own gestures with
      `touch-action` instead, which is the narrower fix.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--    <link rel='icon' type='image/x-icon' href='favicon.ico' />-->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <!--
      The screen the app shows before it is an app.

      Bootstrapping and then decoding the address takes a few seconds on a
      mechanism of any size, all of it synchronous, and none of it can put
      anything on screen: the thread that would paint is the thread doing the
      solving. So this is painted by the browser out of the HTML, before a line
      of the bundle has run, and taken down by `AppComponent` once the app has
      drawn. In between, the window is frozen -- and the frozen thing says
      PMKS+ rather than being blank white.

      Inline for the same reason. A stylesheet is a request, and the point of
      this is to be up before anything has been asked for.
    -->
    <style>
      #bootSplash {
        position: fixed;
        inset: 0;
        z-index: 4000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #fff;
        font-family: Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      #bootSplash .bootMark {
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: #3f51b5;
      }
      #bootSplash .bootBar {
        width: 168px;
        height: 3px;
        border-radius: 2px;
        background: rgba(63, 81, 181, 0.18);
        overflow: hidden;
      }
      #bootSplash .bootBar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #3f51b5;
        animation: bootSlide 1.1s ease-in-out infinite;
      }
      #bootSplash .bootWord {
        font-size: 13px;
        color: rgba(0, 0, 0, 0.55);
      }
      @keyframes bootSlide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #bootSplash .bootBar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <!--
    `dvh` rather than `vh`: on a phone `100vh` is the viewport with the address
    bar *hidden*, so the bottom strip and the playback card sat behind the bar
    until the reader scrolled something -- and nothing here scrolls.
  -->
  <body
    oncontextmenu="return false;"
    class="mat-typography"
    style="width: 100vw; height: 100dvh; overflow: hidden !important"
  >
    <app-root> </app-root>
    <!--
      A sibling of `app-root`, not a child of it. Angular empties its host
      element as soon as the root component renders, which happens *before* the
      canvas is built and the address decoded -- so a splash living inside it
      would come down at exactly the moment the freeze begins.
    -->
    <div id="bootSplash">
      <div class="bootMark">PMKS+</div>
      <div class="bootBar"></div>
      <div class="bootWord">Starting up</div>
    </div>
  </body>
</html>
