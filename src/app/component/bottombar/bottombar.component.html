<!-- Which edge this hugs is which edge it is on: the strip takes the top of
     the window on a phone, and `freeCanvasRect` has to reserve the room where
     the strip actually is or it frames the drawing under it. -->
<div [attr.data-canvas-inset]="viewport.isPhone() ? 'top' : 'bottom'" id="bottomBar">
  <span class="mode">{{ modeName }}</span>
  <span class="status" [class.tuning]="statusIsTuning">{{ status }}</span>
  <span class="spacer"></span>
  <!-- Mobility, said in the one place that already reports what the drawing is
       rather than what it is doing. It is the number every refusal in this app
       is really about -- one input drives one degree of freedom -- and it was
       computed here and never rendered. Hidden where there is nothing to say:
       a linkage with nothing grounded has no mobility, and a dash under a
       heading is worse than no heading. -->
  @if (degreesOfFreedom !== '—') {
    <span
      class="dof"
      title="Degrees of freedom. PMKS+ simulates one input per mechanism, which drives one degree of freedom."
    >
      Degrees of freedom: {{ degreesOfFreedom }}
    </span>
  }
  @if (cursor) {
    <span class="cursor">Cursor: {{ cursor }}</span>
  }
  <span class="units">Units: {{ unitSet }}</span>
</div>
