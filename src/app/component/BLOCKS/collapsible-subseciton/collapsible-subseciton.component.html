<div class="collapsibleSubsection">
  @if (!hideHeader()) {
    <!-- The title and the chevron are one button; anything a section wants to
         put beside them sits outside it. A control nested inside a button is
         neither valid nor operable -- the outer button swallows the press. -->
    <div class="panel-header">
      <button class="panel-header__toggle" (click)="toggleExpand()">
        {{ titleLabel() }}
        <mat-icon class="{{ expanded ? 'rotate180' : '' }}"> expand_more </mat-icon>
      </button>
      <span class="panel-header__actions"><ng-content select="[headerActions]"></ng-content></span>
    </div>
  }
  <!-- Clipped only while the height is moving. Settled open, the box lets
       its children out: a switch's hover ripple is wider than the row it sits
       in, and clipped it drew as a half-circle against the section's edge. -->
  <div
    [@openClose]="expanded ? 'open' : 'closed'"
    class="panel-content"
    [class.settled]="expanded && settled"
  >
    <ng-content></ng-content>
  </div>
</div>
