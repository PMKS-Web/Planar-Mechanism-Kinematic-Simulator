<collapsible-subsection titleLabel="Visual Settings">
  @if (body().geometry.kind === 'bar') {
    <input-block
      [formGroup]="fields"
      _formControl="width"
      [unit]="editor.document().units.length"
      (focusout)="commit('width')"
      >Width</input-block
    >
  }
  <color-picker
    [colors]="colors"
    [selectedColor]="body().presentation.fill"
    (colorSelected)="color($event)"
    >Link Color</color-picker
  >
</collapsible-subsection>
<collapsible-subsection titleLabel="Mass Properties">
  <input-block
    [formGroup]="fields"
    _formControl="mass"
    [unit]="editor.document().units.mass"
    (focusout)="commit('mass')"
    >Mass</input-block
  >
  <input-block
    stacked
    [formGroup]="fields"
    _formControl="inertia"
    [unit]="editor.document().units.inertia"
    (focusout)="commit('inertia')"
    >Moment of Inertia</input-block
  >
  <button mat-button (click)="automatic('inertia')">Use Geometry Inertia</button>
  <p>Center of mass in the link's own coordinates.</p>
  <input-block
    [formGroup]="fields"
    _formControl="cx"
    [unit]="editor.document().units.length"
    (focusout)="commit('cx')"
    >Center X</input-block
  >
  <input-block
    [formGroup]="fields"
    _formControl="cy"
    [unit]="editor.document().units.length"
    (focusout)="commit('cy')"
    >Center Y</input-block
  >
  <button mat-button (click)="automatic('center')">Use Geometry Center</button>
  @if (body().mass.center.mode === 'explicit') {
    <label class="choice"
      >Center Follows
      <select aria-label="Center Follows" [value]="anchorValue()" (change)="anchor($event)">
        <option value="body">Link</option>
        <option value="grid">Grid</option>
        @for (anchor of anchors(); track anchor.id) {
          <option [value]="anchor.id">{{ anchor.label || 'Attachment' }}</option>
        }
      </select></label
    >
  }
</collapsible-subsection>
