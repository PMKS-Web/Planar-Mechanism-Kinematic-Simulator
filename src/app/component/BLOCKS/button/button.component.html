<!-- The tooltip hangs on the row, not the button: a disabled button takes no
     pointer events, so a tooltip on it can never open -- and a gray control's
     reason is the one tooltip a reader most needs. -->
<div
  class="row"
  [matTooltip]="this.tooltip() ?? ''"
  [matTooltipDisabled]="!this.tooltip()"
  [matTooltipShowDelay]="disabled() ? 400 : 1000"
>
  <button
    id="button-block"
    (click)="click()?.()"
    mat-stroked-button
    [color]="this.color()"
    [disabled]="this.disabled()"
    [class]="this.color()"
    [attr.data-action]="dataAction()"
  >
    @if (icon && !customIcon) {
      <mat-icon>{{ icon }}</mat-icon>
    }
    @if (!icon && customIcon) {
      <mat-icon [svgIcon]="customIcon"> </mat-icon>
    }
    <ng-content></ng-content>
  </button>
</div>
