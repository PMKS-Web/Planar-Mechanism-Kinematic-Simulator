<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="840" viewBox="0 0 1040 840">
  <!--
    A car's front wheel and its double-wishbone suspension, seen from in front,
    drawn for the Double-Wishbone Suspension template to be traced over. The
    wheel is drawn whole, and the upright and arms over it, so every pin shows.

    Laid out so that a model point (mx, my), in centimeters, lands at
    ((mx + 22) * 10, (78 - my) * 10), which puts the template's joints on the
    pins drawn here when the picture is placed 104 cm wide centered at
    (30, 36). Full size: the road is y = 0. Drawn for this app; no part of it
    is copied from elsewhere.
  -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#a7b0bc"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8dde5"/>
      <stop offset="1" stop-color="#7f8996"/>
    </linearGradient>
    <linearGradient id="rubber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="0.5" stop-color="#555b65"/>
      <stop offset="1" stop-color="#2e333a"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151a" stop-opacity="0.55"/>
      <stop offset="0.12" stop-color="#11151a" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#11151a" stop-opacity="0"/>
      <stop offset="1" stop-color="#11151a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e7ee"/>
      <stop offset="1" stop-color="#c3cad5"/>
    </linearGradient>
    <linearGradient id="shock" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3af"/>
      <stop offset="0.5" stop-color="#e9edf2"/>
      <stop offset="1" stop-color="#8b94a1"/>
    </linearGradient>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 V14" stroke="#9aa2ae" stroke-width="2"/>
    </pattern>
    <style>
      .part { stroke: #333b47; stroke-width: 3; stroke-linejoin: round; }
      .line { fill: none; stroke: #333b47; stroke-width: 2.5; stroke-linecap: round; }
      .thin { fill: none; stroke: #5d6674; stroke-width: 1.5; }
      .pin { fill: #f4f6f9; stroke: #333b47; stroke-width: 2.5; }
      .spring { fill: none; stroke: #2f6f8f; stroke-width: 7; stroke-linecap: round; }
      .springBack { fill: none; stroke: #23546c; stroke-width: 6; stroke-linecap: round; }
    </style>
  </defs>
  <!-- The road -->
  <rect fill="url(#hatch)" x="0" y="780.0" width="1040" height="60.0"/>
  <path class="line" d="M0 780.0 H1040"/>
  <!-- The car's body: subframe, inner fender and the shock tower -->
  <path class="part" fill="url(#body)" d="M0.0 650.0 L340.0 650.0 L380.0 630.0 L380.0 530.0 L340.0 510.0 L0.0 510.0 Z"/>
  <path class="thin" d="M0.0 580.0 L340.0 580.0"/>
  <path class="part" fill="url(#body)" d="M370.0 400.0 L430.0 380.0 L480.0 320.0 L510.0 220.0 L520.0 170.0 L640.0 170.0 L640.0 80.0 L520.0 60.0 L0.0 60.0 L0.0 180.0 L260.0 200.0 L340.0 280.0 Z"/>
  <path class="thin" d="M0.0 120.0 L500.0 120.0"/>
  <path class="part" fill="url(#body)" d="M520.0 60.0 L640.0 80.0 Q780.0 60.0 1040.0 70.0 L1040.0 20.0 Q780.0 10.0 520.0 10.0 Z"/>
  <path class="part" fill="url(#metal)" d="M300.0 640.0 L410.0 640.0 L420.0 530.0 L360.0 510.0 L310.0 540.0 Z"/>
  <path class="part" fill="url(#metal)" d="M410.0 330.0 L500.0 320.0 L510.0 230.0 L460.0 210.0 L410.0 250.0 Z"/>
  <path class="part" fill="url(#metal)" d="M500.0 160.0 L620.0 160.0 L620.0 100.0 L500.0 100.0 Z"/>
  <!-- The wheel: the tire seen from in front, with its tread grooves -->
  <rect class="part" fill="url(#rubber)" x="710.0" y="140.0" width="220.0" height="640.0" rx="11.2"/>
  <rect fill="url(#roll)" x="710.0" y="140.0" width="220.0" height="640.0" rx="11.2"/>
  <path stroke="#1f2328" stroke-width="4" stroke-linecap="round" d="M765.0 155.0 L765.0 765.0"/>
  <path stroke="#1f2328" stroke-width="4" stroke-linecap="round" d="M820.0 155.0 L820.0 765.0"/>
  <path stroke="#1f2328" stroke-width="4" stroke-linecap="round" d="M875.0 155.0 L875.0 765.0"/>
  <path stroke="#6b727d" stroke-width="2" stroke-linecap="round" d="M726.0 170.0 L726.0 750.0"/>
  <path stroke="#6b727d" stroke-width="2" stroke-linecap="round" d="M914.0 170.0 L914.0 750.0"/>
  <!-- The upright, between the two ball joints, carrying the hub -->
  <path class="part" fill="url(#arm)" d="M680.0 270.0 L720.0 265.0 L730.0 320.0 L740.0 400.0 L780.0 410.0 L780.0 510.0 L755.0 530.0 L770.0 600.0 L765.0 635.0 L720.0 635.0 L715.0 590.0 L725.0 510.0 L710.0 400.0 L685.0 320.0 Z"/>
  <path class="part" fill="url(#arm)" d="M775.0 425.0 L840.0 425.0 L840.0 495.0 L775.0 495.0 Z"/>
  <circle class="pin" cx="820.0" cy="460.0" r="9"/>
  <!-- The upper wishbone: a fork the shock passes through -->
  <path class="part" fill="url(#arm)" d="M435.1 252.9 L720.8 270.8 L719.2 310.8 L432.9 304.9 Z"/>
  <!-- The shock absorber and its coil spring -->
  <path class="part" fill="url(#shock)" d="M571.8 137.8 L608.0 334.5 L584.4 338.9 L548.2 142.2 Z"/>
  <path class="part" fill="url(#shock)" d="M616.3 302.5 L660.1 540.8 L609.0 550.2 L565.2 311.9 Z"/>
  <path class="part" fill="url(#metal)" d="M620.2 179.8 L622.9 194.5 L520.6 213.3 L517.9 198.6 Z"/>
  <path class="part" fill="url(#metal)" d="M662.1 385.6 L664.8 400.3 L554.7 420.6 L552.0 405.8 Z"/>
  <path class="springBack" d="M616.6 209.8 L534.5 239.1"/>
  <path class="springBack" d="M621.6 237.2 L539.5 266.5"/>
  <path class="springBack" d="M626.6 264.6 L544.6 293.9"/>
  <path class="springBack" d="M631.7 292.0 L549.6 321.3"/>
  <path class="springBack" d="M636.7 319.4 L554.7 348.7"/>
  <path class="springBack" d="M641.8 346.8 L559.7 376.1"/>
  <path class="springBack" d="M646.8 374.2 L564.7 403.5"/>
  <path class="spring" d="M529.5 211.7 L616.6 209.8"/>
  <path class="spring" d="M534.5 239.1 L621.6 237.2"/>
  <path class="spring" d="M539.5 266.5 L626.6 264.6"/>
  <path class="spring" d="M544.6 293.9 L631.7 292.0"/>
  <path class="spring" d="M549.6 321.3 L636.7 319.4"/>
  <path class="spring" d="M554.7 348.7 L641.8 346.8"/>
  <path class="spring" d="M559.7 376.1 L646.8 374.2"/>
  <!-- The lower wishbone, with the bracket the shock stands on -->
  <path class="part" fill="url(#arm)" d="M332.5 547.7 L765.8 588.0 L762.0 635.8 L327.7 607.5 Z"/>
  <path class="part" fill="url(#arm)" d="M605.0 602.0 L675.0 606.0 L665.0 554.0 L640.0 544.0 L615.0 554.0 Z"/>
  <circle class="pin" cx="360.0" cy="580.0" r="13"/>
  <circle class="pin" cx="460.0" cy="280.0" r="12"/>
  <circle class="pin" cx="560.0" cy="140.0" r="11"/>
  <circle class="pin" cx="740.0" cy="610.0" r="11"/>
  <circle class="pin" cx="700.0" cy="290.0" r="11"/>
  <circle class="pin" cx="640.0" cy="575.0" r="9"/>
</svg>
