<!-- The pill is one element under all the options, moved by the two custom
     properties the component measures from the chosen option, so the slide is
     a transition rather than a relayout. -->
<!-- Plain buttons that say whether they are pressed, rather than radios: the
     suites find these by their button role, and a pressed button is what a
     reader's assistive tech calls a chosen segment anyway. -->
@if (dropdown()) {
  <label class="dropdownChoice">
    <span>{{ label() }}</span>
    <select
      [value]="selected()"
      [disabled]="disabled()"
      (change)="choose(+$any($event.target).value)"
    >
      @for (option of options(); track $index) {
        <option [value]="$index" [disabled]="isDisabledAt($index)">{{ option }}</option>
      }
    </select>
  </label>
} @else {
  <div
    class="segmented"
    role="group"
    [class.compact]="compact()"
    [class.fit]="!fill()"
    [class.disabled]="disabled()"
  >
    <span class="thumb" aria-hidden="true"></span>
    @for (option of options(); track $index) {
      <button
        #option
        type="button"
        [class.chosen]="$index === selected()"
        [attr.aria-pressed]="$index === selected()"
        [disabled]="isDisabledAt($index)"
        (click)="choose($index)"
      >
        {{ option }}
      </button>
    }
  </div>
}
