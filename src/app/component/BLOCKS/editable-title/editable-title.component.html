<div id="editable-title-block">
  @if (!editMode) {
    <div class="editModeRow titleRow">
      <ng-container *ngTemplateOutlet="contentTpl"></ng-container>
      <span class="objectName">{{ ' ' + (displayName() ?? activeObjService.getSelectedObj()?.name ?? '') }}</span>
      <!--            [matTooltipShowDelay]='1000' matTooltipPosition='above'>-->
    </div>
  }
  @if (editMode) {
    <div class="editModeRow" [formGroup]="newIDForm">
      <ng-container *ngTemplateOutlet="contentTpl"></ng-container>
      <mat-form-field class="customInputForm">
        <input
          class="customInput"
          id="title-input-box"
          aria-label="Name"
          matInput
          type="text"
          #field
          formControlName="newID"
          (keyup.enter)="saveNewID()"
          (keyup.escape)="exitEditModeWithoutSaving()"
          appPrefixFocusAndSelect
        />
      </mat-form-field>
      <!--            matTooltip='Save this name. Escape to cancel.'-->
      <!--            [matTooltipShowDelay]='1000' matTooltipPosition='above'>-->
    </div>
  }
  <!-- Three actions in the row now, so the rename labels are the short ones. -->
  <div class="row">
    <!-- One button for both halves of the rename gesture, sized by its wider
         word the same way the lock button is — entering edit mode must not
         reshuffle the row. Absent for a group, which has no one name. -->
    @if (renamable()) {
      <button
        class="mini-buttons blue"
        mat-stroked-button
        color="primary"
        (click)="editMode ? saveNewID() : gotoEditMode()"
      >
        @if (editMode) {
          <mat-icon>check</mat-icon>
        } @else {
          <mat-icon svgIcon="edit_outline"></mat-icon>
        }
        <span class="labelSwap">
          <span [style.visibility]="editMode ? 'hidden' : 'visible'">Rename</span>
          <span [style.visibility]="editMode ? 'visible' : 'hidden'">Save</span>
        </span>
      </button>
    }
    @if (showsLock()) {
      <!-- The icon states, the label acts: a locked object shows the closed
           padlock beside the word Unlock. Both labels are always in the box,
           one invisible, so the button is sized by the wider word and nothing
           shifts when it toggles. -->
      <button
        class="mini-buttons blue"
        mat-stroked-button
        color="primary"
        (click)="toggleLock()"
        [appShortcutTip]="isLocked() ? 'Unlock' : 'Lock'"
        shortcutTipFor="edit.lock"
      >
        <mat-icon svgIcon="{{ isLocked() ? 'lock' : 'unlock' }}"></mat-icon>
        <span class="labelSwap">
          <span [style.visibility]="isLocked() ? 'visible' : 'hidden'">Unlock</span>
          <span [style.visibility]="isLocked() ? 'hidden' : 'visible'">Lock</span>
        </span>
      </button>
    }
    <!-- Icon only where three labels no longer fit the row: a red trash can
         beside Rename and Lock says everything the word did. Named where there
         is room, so it is not a lone square beside a stretched button. -->
    <button
      class="mini-buttons red"
      [class.iconOnly]="!deleteLabel()"
      mat-stroked-button
      color="warn"
      [attr.aria-label]="deleteLabel() ?? 'Delete'"
      [matTooltip]="deleteLabel() ?? 'Delete'"
      matTooltipShowDelay="600"
      (click)="deleteAction()()"
    >
      <mat-icon svgIcon="remove"></mat-icon>
      @if (deleteLabel(); as label) {
        <span>{{ label }}</span>
      }
    </button>
  </div>
</div>

<ng-template #contentTpl>
  <ng-content></ng-content>
</ng-template>
