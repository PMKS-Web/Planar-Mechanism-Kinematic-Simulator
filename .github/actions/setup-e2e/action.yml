name: Set up an e2e runner
description: >
  Node, locked dependencies, whichever browsers the lane launches, and a served
  development build for the suites to point at.

inputs:
  browsers:
    description: >
      Playwright browsers to install, space separated. `chrome` is real Google
      Chrome, which eight suites launch by path rather than Playwright's
      bundled Chromium.
    required: false
    default: chromium
  port:
    description: Port to serve the build on.
    required: false
    default: '4200'

runs:
  using: composite
  steps:
    - name: Set up Node 24
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.15.0
        cache: npm

    - name: Install locked dependencies
      shell: bash
      run: npm ci

    # Keyed on the Playwright version rather than the lockfile hash: any other
    # dependency moving does not change which browsers are wanted.
    - name: Restore the browser cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: >-
          playwright-${{ runner.os }}-${{ inputs.browsers }}-${{
          hashFiles('package-lock.json') }}

    - name: Install the browsers this lane launches
      shell: bash
      run: npx playwright install --with-deps ${{ inputs.browsers }}

    # The suites that want real Chrome read its path out of PMKS_CHROME, whose
    # default is where macOS keeps it. Playwright's `install chrome` lays down
    # the ordinary .deb, so the runner has it on PATH.
    - name: Point the Chrome suites at Chrome
      if: contains(inputs.browsers, 'chrome ') || endsWith(inputs.browsers, 'chrome')
      shell: bash
      run: |
        chrome="$(command -v google-chrome || true)"
        if [ -z "$chrome" ]; then
          echo "::error::google-chrome is not on PATH; the suites that need it cannot run"
          exit 1
        fi
        echo "PMKS_CHROME=$chrome" >> "$GITHUB_ENV"

    # Development, not production: most suites reach into the app through
    # `window.ng`, which optimization removes.
    - name: Build the app the suites will drive
      shell: bash
      run: npx ng build --configuration development

    - name: Serve it
      shell: bash
      run: |
        node e2e/tools/serve-dist.mjs --port "${{ inputs.port }}" &
        for _ in $(seq 1 60); do
          if curl -fsS "http://localhost:${{ inputs.port }}/" > /dev/null; then
            echo "PMKS_BASE_URL=http://localhost:${{ inputs.port }}" >> "$GITHUB_ENV"
            echo "PMKS_PLAYWRIGHT_DIR=.." >> "$GITHUB_ENV"
            exit 0
          fi
          sleep 1
        done
        echo "::error::nothing answered on port ${{ inputs.port }}"
        exit 1
