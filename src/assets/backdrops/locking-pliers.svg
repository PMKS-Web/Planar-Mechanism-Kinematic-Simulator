<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="320" viewBox="0 0 1160 320">
  <!--
    A ten-inch pair of locking pliers, drawn for the Locking Pliers template to
    be traced over: the frame (upper jaw and handle), the lower jaw, the lower
    handle, the toggle link inside the frame's channel, the adjusting screw it
    rests on, the spring that opens the jaws, and a rod held in the jaws.

    Laid out so that a model point (mx, my), in inches, lands at
    ((mx + 0.6) * 100, (1.4 - my) * 100), which puts the template's joints on
    the rivets drawn here when the picture is placed 11.6 in wide centered at
    (5.2, -0.2) in. Drawn for this app; no part of it is copied from elsewhere.
  -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="0.45" stop-color="#c9d0d9"/>
      <stop offset="1" stop-color="#8d96a3"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c1cc"/>
      <stop offset="1" stop-color="#6c7583"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d9b8"/>
      <stop offset="1" stop-color="#a88a55"/>
    </linearGradient>
    <pattern id="knurl" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#aeb6c1"/>
      <path d="M0 0 V7" stroke="#6c7583" stroke-width="2"/>
    </pattern>
    <style>
      .part { stroke: #333b47; stroke-width: 3; stroke-linejoin: round; }
      .edge { fill: none; stroke: #333b47; stroke-width: 2; stroke-linecap: round; }
      .soft { fill: none; stroke: #ffffff; stroke-width: 2; stroke-opacity: 0.7; stroke-linecap: round; }
      .rivet { fill: #dfe4ea; stroke: #333b47; stroke-width: 2.5; }
      .teeth { fill: none; stroke: #333b47; stroke-width: 2; stroke-linejoin: miter; }
      .spring { fill: none; stroke: #4a5361; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>
  <!-- The frame: fixed jaw, head and upper handle -->
  <path class="part" fill="url(#steel)" d="M62.0 121.0 L172.0 121.0 L180.0 128.0 L178.0 142.0 L190.0 174.0 L215.0 190.0 L240.0 183.0 L265.0 158.0 L295.0 144.0 L1065.0 107.0 L1072.0 98.0 L1070.0 48.0 L1060.0 42.0 L320.0 60.0 L250.0 62.0 L175.0 78.0 L115.0 96.0 L72.0 108.0 L60.0 114.0 Z"/>
  <path class="edge" d="M310.0 134.0 L1060.0 99.0"/>
  <path class="soft" d="M180.0 74.0 Q260.0 54.0 320.0 54.0 L1050.0 48.0"/>
  <path class="teeth" d="M66.0 121.0 L71.0 128.0 L76.0 121.0 L81.0 128.0 L86.0 121.0 L91.0 128.0 L96.0 121.0 L101.0 128.0 L106.0 121.0 L111.0 128.0 L116.0 121.0 L121.0 128.0 L126.0 121.0 L131.0 128.0 L136.0 121.0 L141.0 128.0 L146.0 121.0 L151.0 128.0 L156.0 121.0 L161.0 128.0 L166.0 121.0 L171.0 128.0 L176.0 121.0"/>
  <!-- A cutaway in the handle's side, where the toggle link meets the screw -->
  <clipPath id="window"><path d="M550.0 128.7 L850.0 114.3 L850.0 70.0 L550.0 80.0 Z"/></clipPath>
  <path fill="#59616d" stroke="#333b47" stroke-width="2" d="M550.0 128.7 L850.0 114.3 L850.0 70.0 L550.0 80.0 Z"/>
  <g clip-path="url(#window)">
  <!-- The adjusting screw, tip at the toggle link -->
  <path class="part" fill="url(#steelDark)" d="M665.6 103.2 L1093.8 77.9 L1094.7 91.9 L666.4 117.2 Z"/>
  <path class="edge" stroke-width="1.2" d="M679.6 102.4 L685.4 116.1"/>
  <path class="edge" stroke-width="1.2" d="M689.6 101.8 L695.4 115.5"/>
  <path class="edge" stroke-width="1.2" d="M699.5 101.2 L705.4 114.9"/>
