<div id="settingsWrapper">
  <panel-section>
    <!-- {{ this.currentAngleUnit }} -->
    <title-block> Settings</title-block>
    <collapsible-subseciton titleLabel="Basic Settings" [expanded]="true">
      @if (!documentEditable()) {
        <p class="settingsLockedNote" role="status">{{ lockedNote().trim() }}</p>
      }
      <radio-block
        option1="English (in)"
        option2="Metric (cm)"
        option3="SI (m)"
        [formGroup]="this.settingsForm"
        _formControl="globalunit"
        [tooltip]="'The length unit the whole drawing is measured in.' + lockedNote()"
        [disabled]="!documentEditable()"
        >Global Units
      </radio-block>
      <radio-block
        option1="Degree (&deg;)"
        option2="Radian"
        [formGroup]="this.settingsForm"
        _formControl="angleunit"
        [tooltip]="'The unit for angles, angular velocity and angular acceleration.' + lockedNote()"
        [disabled]="!documentEditable()"
        >Angle Units
      </radio-block>
      @if (showsForceUnit()) {
        <radio-block
          option1="Newton (N)"
          option2="Kilogram-force (kgf)"
          [formGroup]="this.settingsForm"
          _formControl="forceunit"
          [tooltip]="'The unit forces, reactions and torque are shown in.' + lockedNote()"
          [disabled]="!documentEditable()"
          >Force Units
        </radio-block>
      }
      <toggle-block
        [formGroup]="this.settingsForm"
        _formControl="gravity"
        [tooltip]="
          'Weight loads every link that has mass. Turn it off to analyze forces without gravity.' +
          lockedNote()
        "
        [disabled]="!documentEditable()"
      >
        Gravity
      </toggle-block>
      <!-- Input direction and speed belong to the input joint, so they live in that
           joint's Input Settings section in the Edit panel rather than here. -->
    </collapsible-subseciton>

    <collapsible-subseciton titleLabel="Visual Settings" [expanded]="true">
      <toggle-block
        [formGroup]="this.settingsForm"
        _formControl="showMajorGrid"
        tooltip="Show / hide the major grid lines."
      >
        Grid
      </toggle-block>
      @if (settingsService.isShowMajorGrid.value) {
        <toggle-block
          [formGroup]="this.settingsForm"
          _formControl="showMinorGrid"
          tooltip="Show / hide the minor grid lines."
        >
          Minor Gridlines
        </toggle-block>
      }
      <toggle-block
        [formGroup]="this.settingsForm"
        _formControl="snapToGrid"
        tooltip="Dragging a joint or a link lands it on the nearest grid square. Hold Option to drag free of it."
      >
        Snap to Grid
      </toggle-block>
      <toggle-block
        [formGroup]="this.settingsForm"
        _formControl="snapToAlignment"
        tooltip="Dragging squares a joint up with one it is nearly level with. Hold Option to drag free of it."
      >
        Snap to Alignment
      </toggle-block>
      <input-block
        type="number"
        [formGroup]="this.settingsForm"
        _formControl="objectScale"
        tooltip="How big joints, blocks and cylinders are drawn. A drawing that arrives without a size of its own gets one suited to how large it is."
        >Object Size
      </input-block>
      <button-block icon="auto_fix_normal" [click]="updateObjectScale.bind(this)"
        >Auto-size Objects</button-block
      >
    </collapsible-subseciton>

    <!-- Which build this is. It used to sit in the status strip along the
         bottom, where it was permanent furniture answering a question asked
         about twice a year; here it is one line away from the person who wants
         it, and inside the card rather than floating under it. -->
    <div class="versionRow">
      <span class="versionLabel">Version</span>
      <span class="versionValue">PMKS+ {{ appVersion }}</span>
    </div>
  </panel-section>
</div>
