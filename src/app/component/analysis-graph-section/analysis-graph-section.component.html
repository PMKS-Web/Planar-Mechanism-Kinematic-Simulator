<!-- One row per quantity: its name, what it reads at the pose on screen, and a
     chevron. Pressed, it opens in place -- the split above the plot, the plot,
     and the table of what each curve reaches. A card per quantity, each with
     its own legend of switches, was what the rows replaced. -->
<div class="graphSection" [class.open]="expanded()" [class.closed]="!expanded()">
  <!-- The press that opens the row also puts its tooltip away: left up, it
       hung over the row above until the pointer next moved. -->
  <button
    class="graphHeader"
    type="button"
    (click)="toggle(); tip.hide()"
    [attr.aria-expanded]="expanded()"
  >
    <!-- Above, not below: below is where the split and the plot are, and a
         tooltip that lands on the control the reader is reaching for next is
         in the way of the next click. -->
    <span
      class="graphTitle"
      #tip="matTooltip"
      [matTooltip]="help"
      matTooltipPosition="above"
      matTooltipShowDelay="600"
      >{{ label() }}</span
    >
    <span class="graphValue">
      @if (readout) {
        {{ readout }} <span class="graphUnit">{{ unit }}</span>
      } @else {
        —
      }
    </span>
    <mat-icon class="graphChevron">{{ expanded() ? 'expand_less' : 'chevron_right' }}</mat-icon>
  </button>

  <div class="graphBody" [@openClose]="expanded() ? 'open' : 'closed'">
    @if (expanded()) {
      <!-- Two lines or four, never six, and never a lone component: a plot
           with a magnitude offers it or the pair, and a plot with only the
           pair (a position) or only a magnitude (an angle) offers no choice. -->
      @if (hasSplit) {
        <div class="seriesSplit" role="radiogroup" aria-label="Series">
          <button
            type="button"
            role="radio"
            [class.chosen]="mode === 'mag'"
            [attr.aria-checked]="mode === 'mag'"
            (click)="setMode('mag')"
          >
            Magnitude
          </button>
          <button
            type="button"
            role="radio"
            [class.chosen]="mode === 'xy'"
            [attr.aria-checked]="mode === 'xy'"
            (click)="setMode('xy')"
          >
            X &amp; Y components
          </button>
        </div>
      }
      <app-analysis-graph
        #graph
        [analysis]="analysis()"
        [analysisType]="analysisType()"
        [mechProp]="mechProp()"
        [mechPart]="mechPart()"
        [reactionLinkId]="reactionLinkId()"
        [unit]="unit"
        [initialSeries]="shownSeries"
        (shownSeriesChange)="adoptSeries($event)"
      ></app-analysis-graph>
    }
  </div>
</div>
