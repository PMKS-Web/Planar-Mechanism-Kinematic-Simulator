<button
  class="viewButton"
  [class.on]="shown()"
  [disabled]="disabled()"
  (click)="pressed.emit()"
  [appShortcutTip]="tip()"
  [shortcutTipFor]="shortcut()"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="noun() ? shown() : null"
>
  @if (icon(); as ligature) {
    <mat-icon>{{ ligature }}</mat-icon>
  } @else {
    <!-- A switch draws whichever of its two glyphs the grid is in; a plain
         action drawn from our own set names one and keeps it. -->
    <mat-icon [svgIcon]="svg() ?? glyph()"></mat-icon>
  }
</button>
