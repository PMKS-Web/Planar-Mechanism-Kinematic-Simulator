@if (analysisGap; as gap) {
  <div
    class="analysis-gap"
    role="status"
    title="Those are toggle positions: reactions grow without bound as the mechanism approaches them, and the chart leaves a gap rather than inventing a number."
  >
    <mat-icon class="gapIcon">warning_amber</mat-icon>
    <span>No solution at {{ gap.failed }} of {{ gap.total }} positions</span>
    <button class="gapShow" (click)="showGapPosition()">{{ gapShowLabel }}</button>
  </div>
}
<!-- The comparison outlives the gesture. The tuning loop is drag, look, drag
     again, and taking the "before" away at the moment the reader finally has a
     still frame to compare in would serve the code rather than the reader. It
     goes when they say so, or when the next drag takes its own. -->
@if (hasBaseline) {
  <div class="baselineChip">
    <span class="baselineSwatch" aria-hidden="true"></span>
    Before your drag
    <button (click)="clearBaseline()">Clear</button>
  </div>
}
@if (analysisDiagnostic) {
  <div class="analysis-diagnostic" role="status">{{ analysisDiagnostic }}</div>
} @else {
  <!-- In place of the chart rather than over it: these used to be fixed-height
       overlays pinned 100px down the card, which on a short graph covered the
       card below and on a tall one floated in the middle of nothing. -->
  @if (noDataSelected) {
    <div class="graphPlaceholder" role="status">No series shown. Pick one above.</div>
  }
  <app-analysis-apex-chart
    #chart
    [class.hidden]="noDataSelected"
    role="img"
    [attr.aria-label]="graphSummary"
    [class.compact-single-series]="compactSingleSeries"
    [series]="displayedSeries"
    [annotations]="chartOptions.annotations!"
    [chart]="chartOptions.chart"
    [colors]="displayedColors"
    [yaxis]="chartOptions.yaxis!"
    [dataLabels]="chartOptions.dataLabels!"
    [markers]="chartOptions.markers!"
    [stroke]="displayedStroke"
    [grid]="chartOptions.grid"
    [xaxis]="chartOptions.xaxis!"
    [tooltip]="chartOptions.tooltip!"
    [legend]="chartOptions.legend!"
  >
  </app-analysis-apex-chart>
  <!-- The numbers behind every plot leave together, from Export Data in the top
       strip: a button under each graph meant one file per plot, each with its
       own time column to line up by hand. -->
}
