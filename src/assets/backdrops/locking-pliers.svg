  <path class="edge" stroke-width="1.2" d="M1009.0 82.9 L1014.8 96.6"/>
  <path class="edge" stroke-width="1.2" d="M1019.0 82.3 L1024.8 96.0"/>
  <path class="edge" stroke-width="1.2" d="M1029.0 81.7 L1034.8 95.4"/>
  <path class="edge" stroke-width="1.2" d="M1038.9 81.1 L1044.8 94.8"/>
  <path class="edge" stroke-width="1.2" d="M1048.9 80.5 L1054.7 94.2"/>
  <path class="edge" stroke-width="1.2" d="M1058.9 79.9 L1064.7 93.6"/>
  </g>
  <!-- The toggle link, from the handle up to the screw tip -->
  <path class="part" fill="url(#steelDark)" d="M379.5 182.3 L669.4 100.8 L679.6 107.2 L674.4 118.1 L385.6 203.4 L374.9 195.1 Z"/>
  <!-- The lower handle -->
  <path class="part" fill="url(#steel)" d="M232.0 210.0 L258.0 202.0 L320.0 182.0 L396.0 167.0 L500.0 176.0 L710.0 190.0 L1000.0 202.0 L1042.0 206.0 L1050.0 220.0 L1040.0 238.0 L990.0 242.0 L710.0 236.0 L460.0 230.0 L320.0 238.0 L270.0 250.0 L240.0 246.0 L226.0 230.0 Z"/>
  <path class="soft" d="M320.0 188.0 Q396.0 173.0 500.0 182.0 L1000.0 208.0"/>
  <path class="edge" d="M480.0 224.0 L990.0 234.0"/>
  <!-- The release lever -->
  <path class="part" fill="url(#steelDark)" d="M780.0 237.0 L960.0 240.0 L1005.0 258.0 L995.0 270.0 L950.0 260.0 L780.0 246.0 Z"/>
  <!-- The lower jaw -->
  <path class="part" fill="url(#steel)" d="M65.0 165.0 L172.0 165.0 L190.0 145.0 L215.0 142.0 L234.0 156.0 L246.0 192.0 L272.0 214.0 L270.0 240.0 L245.0 248.0 L222.0 235.0 L200.0 202.0 L155.0 200.0 L105.0 192.0 L72.0 178.0 Z"/>
  <path class="teeth" d="M68.0 165.0 L73.0 158.0 L78.0 165.0 L83.0 158.0 L88.0 165.0 L93.0 158.0 L98.0 165.0 L103.0 158.0 L108.0 165.0 L113.0 158.0 L118.0 165.0 L123.0 158.0 L128.0 165.0 L133.0 158.0 L138.0 165.0 L143.0 158.0 L148.0 165.0 L153.0 158.0 L158.0 165.0 L163.0 158.0 L168.0 165.0 L173.0 158.0 L178.0 165.0"/>
  <path class="soft" d="M80.0 173.0 L160.0 173.0"/>
  <!-- A rod held in the jaws -->
  <circle class="part" fill="url(#rod)" cx="120.0" cy="143.0" r="21"/>
  <circle fill="none" stroke="#7a6337" stroke-width="1.5" cx="120.0" cy="143.0" r="13"/>
  <!-- The knurled knob that sets the jaws -->
  <path class="part" fill="url(#knurl)" d="M1072.0 116.0 L1155.0 110.0 L1158.0 56.0 L1072.0 50.0 Z"/>
  <path class="part" fill="url(#steelDark)" d="M1065.0 107.0 L1074.0 118.0 L1074.0 48.0 L1065.0 45.0 Z"/>
  <circle class="rivet" cx="210.0" cy="165.0" r="11"/>
  <circle fill="#ffffff" fill-opacity="0.8" cx="207.0" cy="162.0" r="3"/>
  <circle class="rivet" cx="250.0" cy="225.0" r="11"/>
  <circle fill="#ffffff" fill-opacity="0.8" cx="247.0" cy="222.0" r="3"/>
  <circle class="rivet" cx="396.0" cy="189.0" r="9"/>
  <circle fill="#ffffff" fill-opacity="0.8" cx="393.0" cy="186.0" r="3"/>
</svg>
