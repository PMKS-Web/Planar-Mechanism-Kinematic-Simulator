<div>
  <div
    [@openClose]="frameOpen() ? 'open' : 'closed'"
    id="rightPanel"
    data-canvas-inset="right"
    [class.insisting]="attention"
  >
    <!-- Pinned above whatever else the drawer is showing, rather than taking
         the drawer to itself. A student is meant to be able to open Settings or
         Export *while* following a step, and the drawer showing one page at a
         time meant doing either put the tutorial away. -->
    @if (tutorialShowing()) {
      <!-- Leaves the same way the page below it does: held open by an open page,
           it has to fade on its own; alone in the frame, it travels with the
           frame and only has to stay in the document long enough to do it. -->
      <div class="tutorialSlot" [@drawerCard]="getIsOpen() ? 'held' : 'sole'">
        <app-tutorial-panel></app-tutorial-panel>
      </div>
    }
    <!-- One box for whichever page is open, so the close button can be
         positioned against *it* rather than against the frame. With the
         tutorial pinned above, a button anchored to the frame landed on the
         tutorial's own corner. -->
    @if (getIsOpen()) {
      <div class="drawerPage" [@drawerCard]="tutorialShowing() ? 'held' : 'sole'">
        @if (getOpenTab() === 5) {
          <app-analysis-setup mode="kinematic"></app-analysis-setup>
        }
        @if (getOpenTab() === 6) {
          <app-analysis-setup mode="force"></app-analysis-setup>
        }
        @if (getOpenTab() === 7) {
          <app-export-panel></app-export-panel>
        }
        @if (getOpenTab() === 1) {
          <app-settings-panel></app-settings-panel>
        }
        @if (getOpenTab() === 2) {
          <app-equation-panel></app-equation-panel>
        }
        @if (getOpenTab() === 3) {
          <app-help-panel></app-help-panel>
        }
        <!-- Every drawer closes the same way, from the same corner. Last in the
             page so it paints over the panel it sits on: it shares a line with
             the title, and a title row drawn after it covered it up. -->
        <close-button class="closeDrawer" tooltip="Close" (pressed)="close()"></close-button>
      </div>
    }
  </div>
</div>
