<div id="dual-input-block" style="{{ disabled() ? 'cursor: default' : '' }}">
  @if (!noHeader()) {
    <div class="row">
      <span class="label {{ disabled() ? 'disabled' : '' }}"><ng-content></ng-content></span>
      <!-- Still there while the field is disabled, but plainly not offering
           anything: suppressing only the tooltip left a mark that took the
           accent under the cursor and then answered nothing, which is an
           affordance promising an explanation it does not have. -->
      <mat-icon
        matTooltip="{{ this.tooltip() }}"
        matTooltipShowDelay="400"
        class="label-help"
        [class.inert]="disabled()"
        [matTooltipDisabled]="disabled()"
        >help_outline
      </mat-icon>
      <div class="spacer"></div>
    </div>
  }
  <div class="row" [formGroup]="formGroup()" style="gap: 5px">
    @if (formSubGroup) {
      <span class="label {{ disabled() ? 'disabled' : '' }}">{{ label1() }}</span>
      <mat-form-field
        class="customInputForm"
        formGroupName="{{ formSubGroup }}"
        (click)="field1.select()"
        (mouseenter)="isField1MouseOver = true; updateOverlay()"
        (mouseleave)="isField1MouseOver = false; updateOverlay()"
        (focusin)="isField1Focused = true; updateOverlay()"
        (focusout)="isField1Focused = false; updateOverlay()"
      >
        <input
          class="customInput"
          spellcheck="false"
          matInput
          type="text"
          #field1
          (keyup.enter)="field1.blur()"
          [formControlName]="this.formControl1()"
          [placeholder]="placeholder1()"
          [attr.data-field]="dataField1()"
        />
      </mat-form-field>
      <div class="spacer"></div>
      <span
        class="label {{ disabled() ? 'disabled' : '' }}"
        [class.angle-label]="label2() === '⊾'"
        >{{ label2() }}</span
      >
      <mat-form-field
        class="customInputForm"
        formGroupName="{{ formSubGroup }}"
        (click)="field2.select()"
        (mouseenter)="isField2MouseOver = true; updateOverlay()"
        (mouseleave)="isField2MouseOver = false; updateOverlay()"
        (focusin)="isField2Focused = true; updateOverlay()"
        (focusout)="isField2Focused = false; updateOverlay()"
      >
        <input
          class="customInput"
          spellcheck="false"
          matInput
          type="text"
          #field2
          (keyup.enter)="field2.blur()"
          [formControlName]="this.formControl2()"
          [placeholder]="placeholder2()"
          [attr.data-field]="dataField2()"
        />
      </mat-form-field>
    }
    @if (!formSubGroup) {
      <span class="label {{ disabled() ? 'disabled' : '' }}">{{ label1() }}</span>
      <mat-form-field
        class="customInputForm"
        (click)="field1.select()"
        (mouseenter)="isField1MouseOver = true; updateOverlay()"
        (mouseleave)="isField1MouseOver = false; updateOverlay()"
        (focusin)="isField1Focused = true; updateOverlay()"
        (focusout)="isField1Focused = false; updateOverlay()"
      >
        <input
          class="customInput"
          spellcheck="false"
          matInput
          type="text"
          #field1
          (keyup.enter)="field1.blur()"
          [formControlName]="this.formControl1()"
          [placeholder]="placeholder1()"
          [attr.data-field]="dataField1()"
        />
      </mat-form-field>
      <div class="spacer"></div>
      <span
        class="label {{ disabled() ? 'disabled' : '' }}"
        [class.angle-label]="label2() === '⊾'"
        >{{ label2() }}</span
      >
      <mat-form-field
        class="customInputForm"
        (click)="field2.select()"
        (mouseenter)="isField2MouseOver = true; updateOverlay()"
        (mouseleave)="isField2MouseOver = false; updateOverlay()"
        (focusin)="isField2Focused = true; updateOverlay()"
        (focusout)="isField2Focused = false; updateOverlay()"
      >
        <input
          class="customInput"
          spellcheck="false"
          matInput
          type="text"
          #field2
          (keyup.enter)="field2.blur()"
          [formControlName]="this.formControl2()"
          [placeholder]="placeholder2()"
          [attr.data-field]="dataField2()"
        />
      </mat-form-field>
    }
  </div>
</div>
