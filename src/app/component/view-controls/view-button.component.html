<button
  class="viewButton"
  [class.on]="shown()"
  [disabled]="disabled()"
  (click)="pressed.emit()"
  [matTooltip]="tip()"
  matTooltipPosition="above"
  [matTooltipShowDelay]="600"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="noun() ? shown() : null"
>
  @if (icon(); as ligature) {
    <mat-icon>{{ ligature }}</mat-icon>
  } @else {
    <mat-icon [svgIcon]="glyph()"></mat-icon>
  }
</button>
