[project]
name = "pmks-oracle"
version = "0.1.0"
description = "Independent multibody oracle for PMKS+ verification mechanisms"
requires-python = ">=3.12,<3.13"
dependencies = [
  "exudyn==1.13.6",
  "numpy==2.3.4",
  "scipy==1.16.3",
  "sympy==1.14.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
