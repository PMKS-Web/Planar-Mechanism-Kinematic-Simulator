<div class="playbackRow">
  <!-- In and out from the bottom edge, the way a transport arrives. The view
       controls beside it never move: they say what you can see, which is a
       question every mode has, so they belong in the same corner in all of
       them. -->
  @if (tabs.isAnalysisMode()) {
    <div class="transportCard" @riseFromBottom>
      <button class="speedButton" (click)="cycleSpeed()" [disabled]="!canPlay">{{ speed }}x</button>
      <button
        class="playButton"
        [class.live]="canPlay"
        (click)="play()"
        [disabled]="!canPlay"
        [attr.aria-label]="playing ? 'Pause' : 'Play'"
      >
        <mat-icon>{{ playing ? 'pause' : 'play_arrow' }}</mat-icon>
      </button>
    </div>

    <div class="scrubCard" @riseFromBottom>
      <!-- A tab off the top edge of the card, as in the mock, rather than a
           control inside it: it governs the whole card, so it sits on it. -->
      @if (canSync) {
        <button class="syncToggle" [class.on]="synced" (click)="toggleSync()">
          <mat-icon>{{ synced ? 'unfold_more' : 'unfold_less' }}</mat-icon>
          {{ synced ? 'Control each mechanism' : 'Sync all mechanisms' }}
        </button>
      }

      @for (row of rows; track row.id) {
        <div class="mechRow">
          <button
            class="mechChip"
            [class.selected]="isSelected(row)"
            [class.plain]="!row.isMechanism"
            (click)="selectMechanism(row)"
            (mouseenter)="hoverMechanism(row, true)"
            (mouseleave)="hoverMechanism(row, false)"
            [attr.title]="row.isMechanism ? 'Select ' + row.id : 'All mechanisms move together'"
          >
            {{ row.id }}
          </button>

          @if (row.ownPlay) {
            <button
              class="rowPlay"
              [class.live]="canPlay"
              (click)="toggleRow(row)"
              title="Play / pause"
              [attr.aria-label]="row.playing ? 'Pause ' + row.id : 'Play ' + row.id"
            >
              <mat-icon>{{ row.playing ? 'pause' : 'play_arrow' }}</mat-icon>
            </button>
          }

          <div class="rowBody">
            <div class="trackWell">
              <input
                class="rowScrubber"
                [id]="row.master ? 'slider' : null"
                type="range"
                min="0"
                max="1000"
                [value]="row.scrub"
                [disabled]="!canPlay"
                (mousedown)="onScrubDown(row)"
                (mouseup)="onScrubUp(row)"
                (input)="scrubRow(row, $event)"
              />
            </div>
            <div class="rowLabels">
              <!-- Where the input is, and how long it has been going. Read
                   only: the handle is how you move it, and a typed time is a
                   question about a coordinate the transport no longer uses. -->
              @if (row.position) {
                <span class="rowPosition" [id]="row.master ? 'playbackPosition' : null">{{
                  row.position
                }}</span>
              }
              <span class="rowTime" [id]="row.master ? 'playbackTime' : null">{{ row.time }}</span>
              <span class="rowNote">{{ row.note }}</span>
            </div>
          </div>

          @if (row.isMechanism) {
            <button
              class="dirButton"
              (click)="flipDirection(row)"
              title="Input direction"
              [attr.aria-label]="'Reverse ' + row.id"
            >
              <mat-icon>{{ row.clockwise ? 'rotate_right' : 'rotate_left' }}</mat-icon>
            </button>
          }
        </div>
      }
    </div>
  }

  <app-view-controls></app-view-controls>
</div>
