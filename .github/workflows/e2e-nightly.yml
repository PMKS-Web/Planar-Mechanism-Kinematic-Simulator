# The whole e2e batch, once a night, against `staging`.
#
# The suites are the only thing covering the interaction layer — drags, menus,
# playback, the phone sheet — and nothing runs them, so a suite can encode a
# rule the product reversed months ago and stay quiet about it. That is not
# hypothetical: `locking.mjs` asserted that lock marks stand down outside Edit
# long after the analysis modes were made editable and the marks were kept.
#
# Sharded eight ways it is a quarter of an hour of wall clock and nobody is
# waiting for it, so it runs everything the gate is too slow or too twitchy to
# carry, retries once to tell "broken" from "flaky", and files what it found in
# one issue it keeps updating rather than a new one every morning.

# **This one does not start working when it merges into `staging`.** GitHub reads
# `schedule` and `workflow_dispatch` off the default branch only, and the default
# branch here is `main` — so neither the nightly run nor the Run workflow button
# exists until a release pull request carries this file from `staging` to `main`.
# The gate in `e2e-gate.yml` has no such problem: `pull_request` is read from the
# pull request's own branch, so it works the moment it is opened.

name: E2E nightly

on:
  schedule:
    # 09:00 UTC — after the evening's merges on either coast, before the morning.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to run against.
        required: false
        default: staging
      lane:
        description: Which lane to run.
        required: false
        default: nightly
        type: choice
        options: [nightly, gate]

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  # Eight shards each resolving `staging` for themselves is eight chances to
  # resolve it differently: a merge landing while the batch runs would have some
  # suites testing one commit, some another, and the report naming a third. So
  # the branch is turned into a commit once, here, and everything below is given
  # that commit. No checkout needed to ask.
  revision:
    name: Resolve the revision
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Turn the branch into one commit
        id: resolve
        env:
          REF: ${{ inputs.ref || 'staging' }}
        run: |
          sha="$(git ls-remote "${{ github.server_url }}/${{ github.repository }}" \
            "refs/heads/$REF" | cut -f1)"
          if [ -z "$sha" ]; then
            echo "::error::no branch called $REF"
            exit 1
          fi
          echo "Running against $REF at $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  shard:
    name: e2e nightly ${{ matrix.shard }}/8
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: revision
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # A scheduled run checks out the default branch, which is `main` and a
      # release behind. What wants watching is what is about to be released.
      - name: Check out the revision under test
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false

      - name: Set up an e2e runner
        uses: ./.github/actions/setup-e2e
        with:
          browsers: chromium firefox webkit chrome

      - name: Run this shard
        run: >-
          node e2e/run-suites.mjs
          --lane ${{ inputs.lane || 'nightly' }}
          --shard ${{ matrix.shard }}/8
          --retries 1

      - name: Keep what happened
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-nightly-${{ matrix.shard }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: Report
    runs-on: ubuntu-24.04
    needs: [revision, shard]
    if: always()
    steps:
      - name: Collect the shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-nightly-*
          path: collected
        continue-on-error: true

      - name: Say what failed, in one issue rather than a new one each morning
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Every shard writes report-i-of-8.json wherever it saved artifacts.
            const reports = [];
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const at = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(at);
                else if (/^report-\d+-of-\d+\.json$/.test(entry.name))
                  reports.push(JSON.parse(fs.readFileSync(at, 'utf8')));
              }
            };
            if (fs.existsSync('collected')) walk('collected');

            // Collection is `continue-on-error`, so a partial download reaches here
            // looking exactly like a small, clean run. A shard that exited zero
            // can still have held a flake, so "the shards passed" does not stand
            // in for "we read what they said": every shard has to be accounted
            // for before this is allowed to call anything clean.
            const of = reports[0]?.shardCount ?? 0;
            const seen = new Set(reports.map((report) => report.shardIndex));
            const complete =
              of > 0 && seen.size === of && reports.every((report) => report.shardCount === of);
            const missing = complete
              ? []
              : Array.from({ length: of }, (_, i) => i + 1).filter((i) => !seen.has(i));

            const runs = reports.flatMap((report) => report.results);
            const failed = runs.filter((run) => run.code !== 0);
            const flaky = runs.filter((run) => run.flaky);
            const shardsOk = '${{ needs.shard.result }}' === 'success';

            const title = 'Nightly e2e: suites that are not green';
            const label = 'nightly-e2e';
            // `context.sha` is the commit the *workflow* was read from, and a
            // scheduled run reads it off the default branch — `main`, a release
            // behind the `staging` the shards were given. Never that one.
            // Empty only when the revision job itself failed, in which case no shard
            // ran and this reports that. Never falls back to `context.sha`: being
            // wrong about which commit was tested is the thing being fixed.
            const tested = '${{ needs.revision.outputs.sha }}' || '(unresolved)';
            const lane = '${{ inputs.lane || 'nightly' }}';
            const ref = '${{ inputs.ref || 'staging' }}';
            const { owner, repo } = context.repo;

            // The issue stands for one thing: the whole batch, on staging. A
            // dispatch of the gate lane, or of any lane against a branch, has not
            // run the suites the issue is about — so it may not close it, and may
            // not overwrite what it says. It reports to its own run instead.
            const ownsTheIssue = lane === 'nightly' && ref === 'staging';
            const open = ownsTheIssue
              ? await github.rest.issues.listForRepo({
                  owner, repo, state: 'open', labels: label,
                })
              : { data: [] };
            const existing = open.data[0];

            // The repository has no such label until the first time this runs, and
            // an issue cannot be filed under one that does not exist. Made here
            // rather than by hand, so restoring the repository does not lose it.
            const ensureLabel = async () => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner, repo, name: label, color: 'd93f0b',
                  description: 'Raised by the nightly e2e run; closed when it is green again.',
                });
              }
            };

            // Green means green. A run where every failure passed on the retry has
            // nothing red in it and is still the thing the retry exists to name --
            // closing the issue on it would throw away the only record of a flake.
            // A run that reported nothing and passed nothing is its own problem
            // too: saying "all green" there would be the wrong thing to remember.
            const clean =
              shardsOk && complete && runs.length > 0 && failed.length === 0 && flaky.length === 0;
            if (clean) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Green again as of ${tested.slice(0, 8)} — closing.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed',
                });
              }
              core.summary.addRaw(`Every suite in \`${lane}\` passed on ${ref}.`);
              await core.summary.write();
              return;
            }

            const list = (rows) =>
              rows.length
                ? rows.map((r) => `- \`${r.name}\` (${r.seconds}s)`).join('\n')
                : '_none_';
            const body = [
              `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `Commit: ${tested}`,
              '',
              `**Failed (${failed.length})** — failed twice, so not a flake:`,
              list(failed),
              '',
              `**Flaky (${flaky.length})** — failed, then passed on a retry:`,
              list(flaky),
              '',
              runs.length === 0
                ? '_No shard reported. The run itself broke; read the job logs._'
                : `${runs.length - failed.length - flaky.length}/${runs.length} suites passed first time.`,
              complete
                ? ''
                : `\n**This is not the whole batch.** ${seen.size} of ${of || '?'} shards were ` +
                  `read${missing.length ? ` — nothing from ${missing.join(', ')}` : ''}. ` +
                  'Whatever they found is not in the counts above.',
              '',
              'Screenshots and reports are on the run, under `e2e-nightly-*`. What a flake looked ' +
                'like when it failed is under `artifacts/failed-attempts/`: the retry runs in the ' +
                'same place and would otherwise have drawn over it.',
              '',
              'A suite that fails every night is either a real defect or a check that',
              'has outlived its rule. Both are worth fixing; neither is worth muting.',
            ].join('\n');

            core.summary.addRaw(body.replace(/\n/g, '\n\n'));
            await core.summary.write();

            // A run that did not test what the issue is about says so on its own
            // run page and leaves the issue alone.
            if (!ownsTheIssue) {
              core.notice(`Lane ${lane} on ${ref} does not write the ${label} issue.`);
              return;
            }

            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body,
              });
            } else {
              await ensureLabel();
              await github.rest.issues.create({
                owner, repo, title, body, labels: [label],
              });
            }

      - name: Fail the run if a shard did
        if: needs.shard.result != 'success'
        run: exit 1
