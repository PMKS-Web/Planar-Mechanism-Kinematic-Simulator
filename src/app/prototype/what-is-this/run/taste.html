<title>What Is This? Taste Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
/>
<style>
  /* PMKS+ tokens (src/styles/_tokens.scss), so the panel mocks read as the app. */
  :root {
    --surface: #fff;
    --surface-sunken: #f7f8fc;
    --surface-chip: #eef0f4;
    --border-rule: #eceef5;
    --border-divider: #e0e2ea;
    --text-strong: #202124;
    --text-primary: #2c2c2c;
    --text-secondary: #5f6368;
    --text-tertiary: #80869a;
    --brand: #3f51b5;
    --brand-dark: #303f9f;
    --brand-tint: #e8eaf6;
    --brand-wash: #f5f6fb;
    --success-text: #137333;
    --success-bg: #e6f4ea;
    --warning-text: #9a5b00;
    --warning-bg: #fef3e0;
    --refusal-text: #c5221f;
    --refusal-bg: #fce8e6;
    --page: #eef0f5;
    --link: #3f51b5;
    --link-fill: rgba(63, 81, 181, 0.16);
    --trace: #d62828;
    --path: #b3b8c6;
    --rail: #e3e5ec;
    --rail-edge: #7d8294;
    --highlight: #f29900;
    --tip-bg: #202124;
    --tip-text: #fff;
    --shadow: 0 1px 3px rgba(32, 33, 36, 0.12), 0 4px 14px rgba(32, 33, 36, 0.06);
    --mono: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      color-scheme: dark;
      --surface: #1b1d24;
      --surface-sunken: #22252e;
      --surface-chip: #2c303b;
      --border-rule: #2e323d;
      --border-divider: #3a3f4c;
      --text-strong: #eef0f5;
      --text-primary: #dcdfe6;
      --text-secondary: #a8adba;
      --text-tertiary: #8a90a0;
      --brand: #9fa8da;
      --brand-dark: #c5cae9;
      --brand-tint: #2b3050;
      --brand-wash: #242841;
      --success-text: #81c995;
      --success-bg: #1e3326;
      --warning-text: #f0b45a;
      --warning-bg: #3a2c16;
      --refusal-text: #f28b82;
      --refusal-bg: #3d2322;
      --page: #13151b;
      --link: #9fa8da;
      --link-fill: rgba(159, 168, 218, 0.2);
      --trace: #ff7a7a;
      --path: #535969;
      --rail: #2c303b;
      --rail-edge: #8a90a0;
      --highlight: #fbbc04;
      --tip-bg: #eef0f5;
      --tip-text: #13151b;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --surface: #1b1d24;
    --surface-sunken: #22252e;
    --surface-chip: #2c303b;
    --border-rule: #2e323d;
    --border-divider: #3a3f4c;
    --text-strong: #eef0f5;
    --text-primary: #dcdfe6;
    --text-secondary: #a8adba;
    --text-tertiary: #8a90a0;
    --brand: #9fa8da;
    --brand-dark: #c5cae9;
    --brand-tint: #2b3050;
    --brand-wash: #242841;
    --success-text: #81c995;
    --success-bg: #1e3326;
    --warning-text: #f0b45a;
    --warning-bg: #3a2c16;
    --refusal-text: #f28b82;
    --refusal-bg: #3d2322;
    --page: #13151b;
    --link: #9fa8da;
    --link-fill: rgba(159, 168, 218, 0.2);
    --trace: #ff7a7a;
    --path: #535969;
    --rail: #2c303b;
    --rail-edge: #8a90a0;
    --highlight: #fbbc04;
    --tip-bg: #eef0f5;
    --tip-text: #13151b;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }

  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.55 var(--sans);
    padding-inline: 16px;
    padding-block: 22px 64px;
  }
  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    display: grid;
    gap: 18px;
  }
  h1,
  h2,
  h3 {
    color: var(--text-strong);
    text-wrap: balance;
    margin: 0;
  }
  h1 {
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  h2 {
    font-size: 20px;
    font-weight: 500;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brand);
    font-weight: 500;
  }
  .card {
    background: var(--surface);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 18px 20px;
  }
  button,
  select,
  textarea,
  input {
    font: inherit;
    color: inherit;
  }
  button:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  input:focus-visible,
  summary:focus-visible,
  a:focus-visible,
  .term:focus-visible,
  strong[data-part]:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }
  a {
    color: var(--brand);
  }
  kbd {
    font: 500 11px var(--mono);
    padding: 0 5px;
    border-radius: 4px;
    border: 1px solid var(--border-divider);
    color: var(--text-tertiary);
    background: var(--surface-sunken);
  }

  .top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: end;
    gap: 12px 24px;
  }
  .titles {
    display: grid;
    gap: 4px;
  }
  .top-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .top-controls select {
    border: 1px solid var(--border-divider);
    background: var(--surface);
    border-radius: 8px;
    padding: 7px 10px;
    max-width: 100%;
  }
  .seg {
    display: inline-flex;
    border: 1px solid var(--border-divider);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
  }
  .seg button {
    border: 0;
    background: none;
    color: var(--text-secondary);
    padding: 7px 14px;
    cursor: pointer;
  }
  .seg button + button {
    border-left: 1px solid var(--border-divider);
  }
  .seg button[aria-selected='true'] {
    background: var(--brand-tint);
    color: var(--brand-dark);
    font-weight: 500;
  }
  .lede {
    margin: 0;
    max-width: 90ch;
    color: var(--text-secondary);
    font-size: 14.5px;
  }
  .store {
    font-size: 13px;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .store .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-tertiary);
    flex: none;
  }
  .store.ok .dot {
    background: var(--success-text);
  }
  .store.local {
    color: var(--warning-text);
  }
  .store.local .dot {
    background: var(--warning-text);
  }

  /* One chip per mechanism: close calls first, Claude's calls after them. */
  .strip {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .strip .group {
    font-size: 12px;
    color: var(--text-tertiary);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 4px 0 8px;
  }
  .strip .group:first-child {
    margin-left: 0;
  }
  .strip button {
    border: 1px solid var(--border-divider);
    background: var(--surface);
    color: var(--text-secondary);
    border-radius: 16px;
    padding: 4px 12px 4px 9px;
    cursor: pointer;
    font-size: 13.5px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .strip button .tick {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1.5px solid var(--text-tertiary);
    flex: none;
  }
  .strip button.done .tick {
    background: var(--brand);
    border-color: var(--brand);
  }
  .strip button.claude {
    border-style: dashed;
  }
  .strip button.claude .tick {
    border-radius: 2px;
  }
  .strip button[aria-current='true'] {
    border-color: var(--brand);
    border-style: solid;
    color: var(--text-strong);
    box-shadow: inset 0 0 0 1px var(--brand);
  }

  .stage {
    display: grid;
    grid-template-columns: 330px minmax(0, 1fr);
    gap: 18px;
    align-items: start;
  }
  .mech {
    display: grid;
    gap: 12px;
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
  }
  .mech h2 {
    font-size: 21px;
  }
  .mech .blurb {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-secondary);
  }
  .anim {
    width: 100%;
    height: auto;
    display: block;
    background: var(--surface-sunken);
    border-radius: 8px;
    border: 1px solid var(--border-rule);
  }
  .anim .hl {
    stroke: var(--highlight) !important;
    stroke-opacity: 1 !important;
  }
  .anim polygon.hl {
    fill: color-mix(in srgb, var(--highlight) 30%, transparent) !important;
  }
  .anim g.hl circle {
    stroke: var(--highlight);
    stroke-width: 3;
  }
  .anim-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .anim-controls input[type='range'] {
    flex: 1;
    min-width: 0;
    accent-color: var(--brand);
  }
  .icon-btn {
    border: 1px solid var(--border-divider);
    background: var(--surface);
    border-radius: 8px;
    padding: 4px 10px;
    cursor: pointer;
    min-width: 64px;
  }
  .anim-controls select {
    border: 1px solid var(--border-divider);
    background: var(--surface);
    border-radius: 8px;
    padding: 4px 6px;
  }
  .legend {
    font-size: 12px;
    color: var(--text-tertiary);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    margin-top: 6px;
  }
  .legend i {
    display: inline-block;
    width: 16px;
    vertical-align: middle;
    margin-right: 5px;
  }
  .legend i.trace {
    border-top: 2.5px solid var(--trace);
  }
  .legend i.path {
    border-top: 1.5px solid var(--path);
  }
  .legend i.rail {
    height: 7px;
    background: var(--rail);
    border-block: 1px solid var(--rail-edge);
  }

  .versus {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    align-items: start;
  }
  .versus > .span {
    grid-column: 1 / -1;
  }
  .side {
    display: grid;
    gap: 8px;
  }
  .side-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .side-tag {
    font-weight: 700;
    font-size: 15px;
    color: var(--text-strong);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .side.chosen .side-tag {
    background: var(--brand);
    color: var(--surface);
  }
  .side-meta {
    font-size: 12.5px;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
  }
  .wrong {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 2px 4px;
  }
  .wrong input {
    accent-color: var(--refusal-text);
    width: 16px;
    height: 16px;
  }
  .wrong:has(input:checked) {
    color: var(--refusal-text);
  }

  /* The panel mock: the Analysis card as the app draws it. */
  .panel {
    background: var(--surface);
    border-radius: 10px;
    box-shadow: var(--shadow);
    border-top: 4px solid var(--brand);
    overflow: hidden;
  }
  .side.chosen .panel {
    box-shadow:
      0 0 0 2px var(--brand),
      var(--shadow);
  }
  .panel-title {
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--border-rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .panel-title h3 {
    font-size: 18px;
    font-weight: 500;
  }
  .status {
    font-size: 12.5px;
    padding: 2px 10px;
    border-radius: 12px;
    background: var(--success-bg);
    color: var(--success-text);
  }
  .section {
    padding: 12px 18px 14px;
    border-bottom: 1px solid var(--border-rule);
    display: grid;
    gap: 9px;
  }
  .section:last-child {
    border-bottom: 0;
  }
  .section h4 {
    margin: 0;
    font-size: 15.5px;
    font-weight: 500;
    color: var(--brand);
  }
  .rows {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 3px 14px;
    font-size: 13.5px;
    margin: 0;
  }
  .rows dt {
    color: var(--text-secondary);
  }
  .rows dd {
    margin: 0;
    color: var(--text-strong);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  table.links {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }
  .links th {
    text-align: left;
    font-weight: 500;
    font-size: 11.5px;
    color: var(--text-tertiary);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0 8px 4px 0;
  }
  .links td {
    padding: 4px 8px 4px 0;
    border-top: 1px solid var(--border-rule);
    vertical-align: top;
  }
  .links td:first-child {
    font-weight: 500;
    color: var(--text-strong);
    white-space: nowrap;
  }
  .links td:last-child {
    color: var(--text-secondary);
  }
  .links tr.hl td {
    background: color-mix(in srgb, var(--highlight) 18%, transparent);
  }
  .written {
    background: var(--brand-wash);
    border: 1px solid var(--border-divider);
    border-radius: 8px;
    padding: 11px 13px;
    display: grid;
    gap: 8px;
  }
  .written .by {
    font-size: 12px;
    color: var(--text-tertiary);
  }
  .written p {
    margin: 0;
    color: var(--text-primary);
    font-size: 15px;
    line-height: 1.6;
  }
  .written strong {
    color: var(--text-strong);
    font-weight: 700;
  }
  .written strong[data-part],
  .uses strong[data-part] {
    cursor: pointer;
    border-radius: 3px;
  }
  .written strong[data-part].hl,
  .uses strong[data-part].hl {
    background: color-mix(in srgb, var(--highlight) 30%, transparent);
  }
  .term {
    text-decoration: underline dotted var(--brand);
    text-underline-offset: 3px;
    text-decoration-thickness: 1.5px;
    cursor: help;
  }
  .term.bare {
    text-decoration-color: var(--text-tertiary);
  }
  .how {
    font-size: 12px;
    color: var(--text-tertiary);
  }
  .how strong {
    color: var(--text-secondary);
  }
  .how .term {
    cursor: default;
  }
  .family-line {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 8px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .cert {
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
  }
  .cert-checked,
  .cert-is {
    background: var(--success-bg);
    color: var(--success-text);
  }
  .cert-reading,
  .cert-resembles {
    background: var(--brand-tint);
    color: var(--brand-dark);
  }
  .cert-unsure {
    background: var(--warning-bg);
    color: var(--warning-text);
  }
  .uses {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 9px;
  }
  .uses li {
    display: grid;
    gap: 1px;
  }
  .uses .use {
    font-weight: 500;
    color: var(--text-strong);
  }
  .uses .why {
    color: var(--text-secondary);
    font-size: 14px;
  }
  .caveat {
    font-size: 12px;
    color: var(--text-tertiary);
  }
  .error {
    color: var(--refusal-text);
    background: var(--refusal-bg);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  #tip {
    position: fixed;
    z-index: 10;
    max-width: 260px;
    background: var(--tip-bg);
    color: var(--tip-text);
    font-size: 13px;
    line-height: 1.45;
    padding: 8px 10px;
    border-radius: 8px;
    box-shadow: var(--shadow);
    pointer-events: none;
  }
  #tip b {
    display: block;
    font-weight: 500;
    margin-bottom: 2px;
  }

  .verdict {
    display: grid;
    gap: 12px;
  }
  .verdict-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
  }
  .verdict-head h3 {
    font-size: 16px;
    font-weight: 500;
  }
  .called {
    font-size: 14px;
    background: var(--surface-sunken);
    border-radius: 8px;
    padding: 10px 12px;
    border-left: 3px solid var(--brand);
  }
  .called b {
    font-weight: 500;
    color: var(--text-strong);
  }
  .choice {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }
  .choice button {
    border: 1px solid var(--border-divider);
    background: var(--surface);
    border-radius: 8px;
    padding: 10px 8px;
    cursor: pointer;
    display: grid;
    gap: 2px;
    justify-items: center;
    color: var(--text-primary);
    font-weight: 500;
  }
  .choice button:hover {
    background: var(--brand-wash);
  }
  .choice button[aria-checked='true'] {
    background: var(--brand);
    border-color: var(--brand);
    color: var(--surface);
  }
  .choice button[aria-checked='true'] kbd {
    color: var(--surface);
    border-color: transparent;
    background: rgba(255, 255, 255, 0.18);
  }
  .reasons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    align-items: center;
  }
  .reasons .label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-right: 2px;
  }
  .chip {
    border: 1px solid var(--border-divider);
    background: var(--surface);
    color: var(--text-primary);
    border-radius: 16px;
    padding: 4px 12px;
    cursor: pointer;
    font-size: 13.5px;
  }
  .chip[aria-pressed='true'] {
    background: var(--brand-tint);
    border-color: var(--brand);
    color: var(--brand-dark);
    font-weight: 500;
  }
  .reasons[aria-disabled='true'] {
    opacity: 0.45;
    pointer-events: none;
  }
  textarea {
    width: 100%;
    min-height: 76px;
    resize: vertical;
    border: 1px solid var(--border-divider);
    border-radius: 8px;
    padding: 9px 11px;
    background: var(--surface-sunken);
    line-height: 1.5;
  }
  .verdict-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .primary {
    background: var(--brand);
    color: var(--surface);
    border: 0;
    border-radius: 8px;
    padding: 9px 18px;
    cursor: pointer;
    font-weight: 500;
  }
  .secondary {
    background: var(--surface);
    color: var(--brand);
    border: 1px solid var(--border-divider);
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    font-weight: 500;
  }
  .primary:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .hint {
    font-size: 13px;
    color: var(--text-tertiary);
  }
  .hint.warn {
    color: var(--warning-text);
  }

  .reveal {
    display: grid;
    gap: 14px;
    border-left: 4px solid var(--brand);
  }
  .reveal h3 {
    font-size: 16px;
    font-weight: 500;
  }
  .who-was {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  .who-was > div {
    display: grid;
    gap: 6px;
    align-content: start;
  }
  .who-was .sheet-name {
    font-weight: 500;
    color: var(--text-strong);
  }
  .who-was img {
    border-radius: 6px;
    border: 1px solid var(--border-rule);
    background: #fff;
  }
  .flags {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 4px;
    font-size: 13.5px;
  }
  .flags li {
    color: var(--warning-text);
  }
  .flags li.none {
    color: var(--text-tertiary);
  }
  .fam {
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    padding: 1px 8px;
    border-radius: 10px;
  }
  .fam.named {

<script>
  const DATA = /*DATA*/ null;
  const REASONS = [
    'More correct',
    'Names it better',
    'Better uses',
    'Clearer for a student',
    'Tighter',
    'Better detail about this mechanism',
  ];
  const CYCLE_SECONDS = 4;
  const esc = (s) =>
    String(s ?? '').replace(
      /[&<>"]/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]
    );
  const $ = (id) => document.getElementById(id);

  const prefs = (() => {
    try {
      return JSON.parse(localStorage.getItem('taste-prefs') || '{}');
    } catch (e) {
      return {};
    }
  })();
  const savePrefs = () => {
    try {
      localStorage.setItem('taste-prefs', JSON.stringify({ round: state.round, tab: state.tab }));
    } catch (e) {}
  };

  const state = {
    round: DATA.rounds.some((r) => r.id === prefs.round)
      ? prefs.round
      : DATA.rounds[DATA.rounds.length - 1].id,
    index: 0,
    tab: prefs.tab === 'results' ? 'results' : 'judge',
    drafts: new Map(),
    hint: '',
  };
  let votes = new Map();
  let db = null;
  let storeMode = 'pending';
  let placed = false;

  const round = () => DATA.rounds.find((r) => r.id === state.round);
  /** Close calls first, then the ones Claude decided, so the strip reads in the order to judge them. */
  const ordered = () => {
    const pairs = round().pairs;
    return [...pairs.filter((p) => !p.decided), ...pairs.filter((p) => p.decided)];
  };
  const pair = () => ordered()[state.index];
  const voteId = (r, p) => `${r.id}~${p.template}`;
  const voteFor = (p) => votes.get(voteId(round(), p));
  const sheetTitle = (armId) => DATA.sheets[armId.split('~')[0]]?.title ?? armId;
  const armLabel = (arm) =>
    `${sheetTitle(arm.id)}${arm.sample > 1 ? ` (asking ${arm.sample})` : ''}`;
  /** Claude's call on a decided pair, said as a side of this pair: 'left', 'right', 'same' or 'both-poor'. */
  const claudeSide = (p) => {
    if (!p.decided) return null;
    const pick = p.decided.pick;
    if (pick === 'same' || pick === 'both-poor') return pick;
    const armId = pick === 'a' ? round().a : round().b;
    return p.left.id === armId ? 'left' : 'right';
  };

  /* ---------- Vote storage: the page's database, or this browser when there is none ---------- */
  function localVotes() {
    try {
      return new Map(Object.entries(JSON.parse(localStorage.getItem('taste-votes') || '{}')));
    } catch (e) {
      return new Map();
    }
  }
  function saveLocal() {
    try {
      localStorage.setItem('taste-votes', JSON.stringify(Object.fromEntries(votes)));
    } catch (e) {}
  }
  function renderStore() {
    $('store').className =
      'store' + (storeMode === 'db' ? ' ok' : storeMode === 'pending' ? '' : ' local');
    $('store-text').textContent =
      storeMode === 'db'
        ? 'Votes save to this page’s database, where Claude can read them.'
        : storeMode === 'pending'
          ? 'Connecting to the vote store…'
          : 'Votes are saved in this browser only, so Claude can’t read them. Open the page on claude.ai, or use “Copy votes” on the Results tab.';
  }
  async function connect() {
    let ns = null;
    try {
      ns = window.claude && window.claude.use ? await window.claude.use('db') : null;
    } catch (e) {
      ns = null;
    }
    if (!ns) {
      storeMode = 'local';
      votes = localVotes();
      placeOnFirstOpen();
      renderAll();
      return;
    }
    db = ns;
    storeMode = 'db';
    db.collection('votes').onSnapshot(
      (snap) => {
        votes = new Map(snap.docs.map((d) => [d.id, d.data()]));
        placeOnFirstOpen();
        renderAll();
      },
      () => {
        storeMode = 'local';
        votes = localVotes();
        renderAll();
      }
    );
    renderStore();
  }
  /** Open on the first close call not yet voted on. */
  function placeOnFirstOpen() {
    if (placed) return;
    placed = true;
    const first = ordered().findIndex((p) => !p.decided && !voteFor(p));
    state.index = first < 0 ? 0 : first;
  }

  /* ---------- Draft: what the form holds for the pair on screen ---------- */
  function draft(p) {
    const key = voteId(round(), p);
    if (!state.drafts.has(key)) {
      const v = votes.get(key);
      state.drafts.set(
        key,
        v
          ? {
              choice: v.choice,
              reasons: [...(v.reasons || [])],
              note: v.note || '',
              wrongLeft: !!v.wrongLeft,
              wrongRight: !!v.wrongRight,
            }
          : { choice: null, reasons: [], note: '', wrongLeft: false, wrongRight: false }
      );
    }
    return state.drafts.get(key);
  }

  async function saveVote() {
    const p = pair();
    const d = draft(p);
    if (!d.choice) {
      state.hint = 'Pick one of the four first.';
      renderVerdict();
      return;
    }
    const winner = d.choice === 'left' ? p.left.id : d.choice === 'right' ? p.right.id : d.choice;
    const vote = {
      round: round().id,
      template: p.template,
      left: p.left.id,
      right: p.right.id,
      choice: d.choice,
      winner,
      wrongLeft: d.wrongLeft,
      wrongRight: d.wrongRight,
      wrong: [d.wrongLeft && p.left.id, d.wrongRight && p.right.id].filter(Boolean),
      identicalSheets: p.identical,
      claudeCall: p.decided ? p.decided.pick : null,
      reasons: d.reasons,
      note: d.note.trim(),
      savedAt: new Date().toISOString(),
    };
    const key = voteId(round(), p);
    $('save').disabled = true;
    try {
      if (db) await db.doc(`votes/${key}`).set(vote);
      votes.set(key, vote);
      if (!db) saveLocal();
      state.hint = db ? 'Saved.' : 'Saved in this browser.';
    } catch (e) {
      state.hint = `Not saved: ${e && e.message ? e.message : 'the store refused it'}. Try again.`;
    }
    $('save').disabled = false;
    renderAll();
  }

  /* ---------- Panel mock ---------- */
  /** A part name as the fact sheet writes it, reduced to what the animation knows it by. */
  const partKey = (name) =>
    name
      .replace(/^(link|joint|slider|pin|cylinder|point)\s+/i, '')
      .replace(/\s/g, '')
      .replace('–', '-');
  /**
   * Bold names become parts that point into the mechanism; the terms the model
   * listed become glossary words with their meaning behind them. v3 answers
   * gave bare terms, which get the underline and a note that nothing is behind it.
   */
  function renderParagraph(text, terms) {
    let html = esc(text).replace(
      /\*\*(.+?)\*\*/g,
      (_, name) => `<strong data-part="${esc(partKey(name))}" tabindex="0">${name}</strong>`
    );
    const list = (terms || [])
      .map((t) => (typeof t === 'string' ? { term: t } : t))
      .filter((t) => t && t.term);
    for (const t of list.sort((a, b) => b.term.length - a.term.length)) {
      const re = new RegExp(
        '(^|[^\\w>])(' + t.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![\\w<])',
        'i'
      );
      const meaning = t.meaning ? esc(t.meaning) : '';
      html = html.replace(
        re,
        `$1<span class="term${meaning ? '' : ' bare'}" tabindex="0" data-term="${esc(t.term)}" data-meaning="${meaning}">$2</span>`
      );
    }
    return html;
  }
  function linksTable(p) {
    if (!p.jobs || !p.jobs.length) return '';
    const rows = p.jobs
      .map(
        (j) =>
          `<tr data-part="${esc(partKey(j.name))}"><td>${esc(j.name.replace(/^link /, ''))}</td><td>${esc(j.job.split(';')[0])}</td></tr>`
      )
      .join('');
    return `<div class="section"><h4>Links</h4><table class="links"><thead><tr><th>Part</th><th>Job</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  function familyLine(arm, a) {
    if (a.certainty) {
      const cert = ['is', 'resembles', 'unsure'].includes(a.certainty) ? a.certainty : 'unsure';
      return `Family: <strong>${esc(a.family)}</strong><span class="cert cert-${cert}">${esc(cert)}</span>`;
    }
    return arm.familyCheck
      ? `Family: <strong>${esc(a.family)}</strong><span class="cert cert-checked" title="PMKS+ matched ${esc(arm.familyCheck)} from lengths, joints and motion">checked by PMKS+</span>`
      : `Family: <strong>${esc(a.family)}</strong><span class="cert cert-reading" title="PMKS+ found no match in its catalog; this is the model's reading">model’s reading</span>`;
  }
  function panel(p, arm) {
    if (!arm.answer)
      return `<div class="error">No answer: ${esc(arm.error || 'the reply was not JSON')}</div>`;
    const a = arm.answer;
    const rows = p.overview.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
    const uses = (a.useCases || [])
      .map(
        (u) =>
          `<li><span class="use">${renderParagraph(u.use)}</span><span class="why">${renderParagraph(u.why)}</span></li>`
      )
      .join('');
    return `
      <article class="panel">
        <div class="panel-title"><h3>Mechanism M1</h3><span class="status">Ready</span></div>
        <div class="section"><h4>Overview</h4><dl class="rows">${rows}</dl></div>
        ${linksTable(p)}
        <div class="section">
          <h4>In plain English</h4>
          <div class="written">
            <div class="by">✎ Written from the facts above, not measured</div>
            <p>${renderParagraph(a.plainEnglish, a.terms)}</p>
            <div class="how">Point at a <strong>bold part</strong> to find it in the mechanism, or a <span class="term">dotted word</span> for its meaning.</div>
          </div>
          <div class="family-line">${familyLine(arm, a)}</div>
        </div>
        <div class="section">
          <h4>Where you’d find it</h4>
          <ul class="uses">${uses || '<li class="why">None given: the model named no common use it was sure of.</li>'}</ul>
          <div class="caveat">From general engineering knowledge, not from this mechanism.</div>
        </div>
      </article>`;
  }

  /* ---------- Pointing: a part lights up in the mechanism, a term shows its meaning ---------- */
  function highlight(key) {
    document.querySelectorAll('.hl').forEach((el) => el.classList.remove('hl'));
    if (!key) return;
    document
      .querySelectorAll(`[data-part="${CSS.escape(key)}"]`)
      .forEach((el) => el.classList.add('hl'));
    for (const el of anim.parts.get(key) || []) el.classList.add('hl');
  }
  function showTip(el) {
    const tip = $('tip');
    const meaning = el.dataset.meaning;
    tip.innerHTML = `<b>${esc(el.dataset.term)}</b>${meaning || 'The model listed this word but gave no meaning (v3 answers did not).'}`;
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const w = tip.offsetWidth;
    const h = tip.offsetHeight;
    const left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
    const top = r.top - h - 8 > 8 ? r.top - h - 8 : r.bottom + 8;
    tip.style.left = `${left}px`;
    tip.style.top = `${top}px`;
  }
  const hideTip = () => ($('tip').hidden = true);
  document.addEventListener('mouseover', (e) => {
    const part = e.target.closest('[data-part]');
    if (part) highlight(part.dataset.part);
    const term = e.target.closest('.term[data-term]');
    if (term) showTip(term);
  });
  document.addEventListener('mouseout', (e) => {
    if (e.target.closest('[data-part]')) highlight(null);
    if (e.target.closest('.term[data-term]')) hideTip();
  });
  document.addEventListener('focusin', (e) => {
    const part = e.target.closest('[data-part]');
    if (part) highlight(part.dataset.part);
    const term = e.target.closest('.term[data-term]');
    if (term) showTip(term);
  });
  document.addEventListener('focusout', () => {
    highlight(null);
    hideTip();
  });
  window.addEventListener('scroll', hideTip, { passive: true });

  /* ---------- Mechanism animation ---------- */
  const anim = {
    pair: null,
    els: null,
    parts: new Map(),
    frame: 0,
    phase: 0,
    playing: !matchMedia('(prefers-reduced-motion: reduce)').matches,
    last: 0,
  };
  const NS = 'http://www.w3.org/2000/svg';
  const svgEl = (tag, attrs, parent) => {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (parent) parent.appendChild(el);
    return el;
  };
  function hull(points) {
    const s = points.map((p, i) => [p[0], p[1], i]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (s.length <= 2) return s;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const p of s) {
      while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0)
        lower.pop();
      lower.push(p);
    }
    const upper = [];
    for (const p of [...s].reverse()) {
      while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0)
        upper.pop();
      upper.push(p);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
  }
  function setupAnimation(p) {
    const svg = $('anim');
    svg.replaceChildren();
    anim.pair = p;
    anim.parts = new Map();
    const m = p.motion;
    if (!m) {
      anim.els = null;
      return;
    }
    const all = m.frames.flat();
    const xs = all.map((q) => q[0]);
    const ys = all.map((q) => q[1]);
    const W = 400;
    const H = 300;
    const PAD = 26;
    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);
    const k = Math.min(
      (W - 2 * PAD) / Math.max(maxX - minX, 1e-6),
      (H - 2 * PAD) / Math.max(maxY - minY, 1e-6)
    );
    const ox = (W - (maxX - minX) * k) / 2;
    const oy = (H - (maxY - minY) * k) / 2;
    const px = (x) => ox + (x - minX) * k;
    const py = (y) => oy + (maxY - y) * k;
    const pts = (list) => list.map(([x, y]) => `${px(x).toFixed(1)},${py(y).toFixed(1)}`).join(' ');
    const addPart = (key, el) => anim.parts.set(key, [...(anim.parts.get(key) || []), el]);

    // A fixed guide is a rail -- a pale band between two edges -- so it cannot
    // be mistaken for a path. Paths are solid: a dashed path traced back and
    // forth over itself reads as solid in places and dashed in others.
    const guides = svgEl('g', {}, svg);
    for (const [a, b] of m.guides) {
      const x1 = px(a[0]);
      const y1 = py(a[1]);
      const x2 = px(b[0]);
      const y2 = py(b[1]);
      const len = Math.hypot(x2 - x1, y2 - y1) || 1;
      const nx = (-(y2 - y1) / len) * 4.5;
      const ny = ((x2 - x1) / len) * 4.5;
      svgEl(
        'line',
        { x1, y1, x2, y2, stroke: 'var(--rail)', 'stroke-width': 9, 'stroke-linecap': 'butt' },
        guides
      );
      for (const s of [1, -1])
        svgEl(
          'line',
          {
            x1: x1 + s * nx,
            y1: y1 + s * ny,
            x2: x2 + s * nx,
            y2: y2 + s * ny,
            stroke: 'var(--rail-edge)',
            'stroke-width': 1,
          },
          guides
        );
    }
    const paths = svgEl('g', { fill: 'none' }, svg);
    m.joints.forEach((j, i) => {
      if (j.ground) return;
      svgEl(
        'polyline',
        {
          points: pts(m.frames.map((f) => f[i])),
          stroke: j.traced ? 'var(--trace)' : 'var(--path)',
          'stroke-width': j.traced ? 2 : 1,
        },
        paths
      );
    });
    const bodies = svgEl('g', {}, svg);
    const bodyEls = m.bodies.map((ids) => {
      const el =
        ids.length === 2
          ? svgEl(
              'line',
              {
                stroke: 'var(--link)',
                'stroke-width': 6,
                'stroke-linecap': 'round',
                'stroke-opacity': 0.75,
              },
              bodies
            )
          : svgEl(
              'polygon',
              {
                fill: 'var(--link-fill)',
                stroke: 'var(--link)',
                'stroke-width': 2.5,
                'stroke-linejoin': 'round',
              },
              bodies
            );
      addPart(ids.map((i) => m.joints[i].id).join(''), el);
      return el;
    });
    const cylEls = m.cylinders.map(([a, b]) => {
      const pair = [
        svgEl(
          'line',
          { stroke: 'var(--text-strong)', 'stroke-width': 10, 'stroke-linecap': 'round' },
          bodies
        ),
        svgEl(
          'line',
          { stroke: 'var(--text-tertiary)', 'stroke-width': 4, 'stroke-linecap': 'round' },
          bodies
        ),
      ];
      pair.forEach((el) => addPart(`${m.joints[a].id}-${m.joints[b].id}`, el));
      return pair;
    });
    const joints = svgEl('g', {}, svg);
    const jointEls = m.joints.map((j) => {
      const g = svgEl('g', {}, joints);
      if (j.ground)
        svgEl('polygon', { points: '0,0 -8,13 8,13', fill: 'var(--text-secondary)' }, g);
      if (j.slider)
        svgEl(
          'rect',
          { x: -7, y: -5, width: 14, height: 10, rx: 2, fill: 'var(--text-strong)' },
          g
        );
      svgEl(
        'circle',
        { r: 4, fill: 'var(--surface)', stroke: 'var(--text-strong)', 'stroke-width': 1.6 },
        g
      );
      const t = svgEl(
        'text',
        {
          x: 6,
          y: -6,
          fill: 'var(--text-strong)',
          'font-size': 14,
          'font-weight': 700,
          'font-family': 'Roboto, Arial, sans-serif',
          'paint-order': 'stroke',
          stroke: 'var(--surface-sunken)',
          'stroke-width': 3,
        },
        g
      );
      t.textContent = j.id;
      addPart(j.id, g);
      return g;
    });
    anim.els = { bodyEls, cylEls, jointEls, px, py };
    anim.phase = 0;
    $('scrub').max = String(m.frames.length - 1);
    drawFrame(0);
  }
  function drawFrame(f) {
    const m = anim.pair && anim.pair.motion;
    if (!m || !anim.els) return;
    anim.frame = f;
    const frame = m.frames[f];
    const { bodyEls, cylEls, jointEls, px, py } = anim.els;
    m.bodies.forEach((ids, b) => {
      const el = bodyEls[b];
      if (ids.length === 2) {
        const [p, q] = [frame[ids[0]], frame[ids[1]]];
        el.setAttribute('x1', px(p[0]));
        el.setAttribute('y1', py(p[1]));
        el.setAttribute('x2', px(q[0]));
        el.setAttribute('y2', py(q[1]));
      } else {
        el.setAttribute(
          'points',
          hull(ids.map((i) => frame[i]))
            .map(([x, y]) => `${px(x).toFixed(1)},${py(y).toFixed(1)}`)
            .join(' ')
        );
      }
    });
    m.cylinders.forEach(([a, b], c) => {
      const p = frame[a];
      const q = frame[b];
      const mx = (p[0] + q[0]) / 2;
      const my = (p[1] + q[1]) / 2;
      const [barrel, rod] = cylEls[c];
      barrel.setAttribute('x1', px(p[0]));
      barrel.setAttribute('y1', py(p[1]));
      barrel.setAttribute('x2', px(mx));
      barrel.setAttribute('y2', py(my));
      rod.setAttribute('x1', px(mx));
      rod.setAttribute('y1', py(my));
      rod.setAttribute('x2', px(q[0]));
      rod.setAttribute('y2', py(q[1]));
    });
    jointEls.forEach((g, i) =>
      g.setAttribute(
        'transform',
        `translate(${px(frame[i][0]).toFixed(1)} ${py(frame[i][1]).toFixed(1)})`
      )
    );
    $('scrub').value = String(f);
  }
  function frameAtPhase(m, phase) {
    const t0 = m.time[0];
    const span = m.time[m.time.length - 1] - t0;
    if (!(span > 0)) return Math.floor(phase * (m.frames.length - 1));
    const target = t0 + phase * span;
    let lo = 0;
    let hi = m.time.length - 1;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (m.time[mid] <= target) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  }
  function tick(now) {
    const m = anim.pair && anim.pair.motion;
    if (m && anim.playing && state.tab === 'judge') {
      const dt = anim.last ? Math.min(0.1, (now - anim.last) / 1000) : 0;
      anim.phase = (anim.phase + (dt * Number($('speed').value)) / CYCLE_SECONDS) % 1;
      const f = frameAtPhase(m, anim.phase);
      if (f !== anim.frame) drawFrame(f);
    }
    anim.last = now;
    requestAnimationFrame(tick);
  }
  $('play').addEventListener('click', () => {

  });
  $('scrub').addEventListener('input', (e) => {
    const m = anim.pair && anim.pair.motion;

    const span = m.time[m.time.length - 1] - m.time[0];
    anim.phase = span > 0 ? (m.time[f] - m.time[0]) / span : f / (m.frames.length - 1);
    drawFrame(f);

  /* ---------- Rendering ---------- */
  function renderHeader() {

    $('results').hidden = state.tab !== 'results';

    $('lede').textContent =
      (decided
        ? `Claude decided ${decided} of ${r.pairs.length} pairs where one answer was clearly better or they were plainly alike; ${close.length} close call${close.length === 1 ? ' is' : 's are'} left for you (${done} judged). You can still open any of Claude's and vote. `
        : `${done} of ${r.pairs.length} judged. `) +
      'Each mechanism has two answers from GPT-6 Luna, one per fact-sheet version, on randomly chosen sides; which is which shows after you save. ' +
      (r.note || '');
  }

    const list = ordered();
    const close = list.filter((p) => !p.decided);
    const decided = list.filter((p) => p.decided);
    $('strip').innerHTML =
      (close.length
        ? `<span class="group">Close calls</span>${close.map((p) => chip(p, list.indexOf(p))).join('')}`

      (decided.length

  }
  let shownPair = null;
  function renderPair() {

  function renderVerdict() {
    const p = pair();

      ['c-right', 'right'],

  function renderReveal() {

  }

  /** Each pair's outcome: your vote where you gave one, otherwise Claude's call. */
  function outcome(p) {
    const r = round();
    const v = voteFor(p);
    if (v) {
      const winner =
        v.choice === 'same' || v.choice === 'both-poor' ? v.choice : v.winner === r.a ? 'a' : 'b';
      return { by: 'you', winner };
    }
    if (p.decided) return { by: 'claude', winner: p.decided.pick };
    return null;
  }
  function tallyOf(pairs) {
    const t = { a: 0, b: 0, same: 0, poor: 0, n: pairs.length, judged: 0 };
    for (const p of pairs) {
      const o = outcome(p);
      if (!o) continue;
      t.judged++;
      if (o.winner === 'same') t.same++;
      else if (o.winner === 'both-poor') t.poor++;
      else t[o.winner]++;
    }
    return t;
  }
  function bar(t) {
    const total = Math.max(t.judged, 1);

        ? `<span class="${cls}" style="width:${(n / total) * 100}%" title="${esc(label)}: ${n}">${n}</span>`
        : '';
    return `<div class="bar">${seg('b-a', t.a, sheetTitle(round().a))}${seg('b-same', t.same, 'About the same')}${seg('b-b', t.b, sheetTitle(round().b))}${seg('b-poor', t.poor, 'Both poor')}</div>`;
  }

          <div class="stat"><span class="v">${count(r.a, 'application', 'named')} · ${count(r.b, 'application', 'named')}</span><span class="k">Uses name the real machine, of ${useTotal}</span></div>

  $('wrong-right').addEventListener('change', (e) => (draft(pair()).wrongRight = e.target.checked));
  $('note').addEventListener('input', (e) => (draft(pair()).note = e.target.value));
  $('save').addEventListener('click', saveVote);
  $('next').addEventListener('click', () => {
    const list = ordered();
    const after = list.findIndex((p, i) => i > state.index && !p.decided && !voteFor(p));
    go(after >= 0 ? after : state.index + 1);
  });
  document.addEventListener('click', async (e) => {
    if (e.target.id !== 'copy') return;
    const text = JSON.stringify(
      [...votes.values()].filter((v) => v.round === state.round),
      null,
      2
    );
    try {
      await navigator.clipboard.writeText(text);
      $('copy-hint').textContent = 'Copied.';
    } catch (err) {
      $('copy-hint').textContent = 'Copy was refused; here it is to select:';
      const pre = document.createElement('pre');
      pre.className = 'diff';
      pre.textContent = text;
      $('copy-hint').after(pre);
    }
  });
  document.addEventListener('keydown', (e) => {
    if (state.tab !== 'judge') return;
    const typing = ['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement?.tagName);
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      saveVote();
      return;
    }
    if (typing) return;
    const map = { 1: 'left', 2: 'same', 3: 'right', 4: 'both-poor' };
    if (map[e.key]) {
      const d = draft(pair());
      d.choice = map[e.key];
      if (!['left', 'right'].includes(d.choice)) d.reasons = [];
      renderVerdict();
    } else if (e.key === 'ArrowRight') go(state.index + 1);
    else if (e.key === 'ArrowLeft') go(state.index - 1);
  });

  renderAll();
  requestAnimationFrame(tick);
  connect();
</script>
