# The e2e suites a pull request has to get past.
#
# Only the ones that have earned it: `lanes: ['gate']` in `e2e/suites.mjs` means
# a suite is fast, and has been green on the nightly often enough to be trusted
# to say something when it goes red. Everything else runs in `e2e-nightly.yml`,
# where a failure costs attention instead of blocking a merge.
#
# That split is the whole design. There are about ninety suites carrying
# something like twelve hundred fixed waits between them, tuned on the machines
# they were written on; a shared runner is slower and noisier, and a required
# check that goes red for that reason teaches people to press re-run, which
# costs more than having no check at all.
#
# Deliberately not filtered by path. A skipped job and a passing one are not the
# same thing to a required status check, and a documentation change really can
# reach the app: the gallery renders `docs/*.md` at build time.

name: E2E gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: e2e gate ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out tested source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up an e2e runner
        uses: ./.github/actions/setup-e2e
        with:
          # Chromium only. Five suites launch the system's own Chrome by path, and
          # what that is on a runner is whatever was installed that morning — on the
          # first Linux run one of them passed its own checks and then hung thirty
          # seconds in `page.screenshot`. They run in the nightly, which installs it.
          browsers: chromium

      - name: Run this shard of the gate
        run: node e2e/run-suites.mjs --lane gate --shard ${{ matrix.shard }}/4

      # The exit code says a suite failed. What it looked like is in the
      # screenshots and reports the suite saved, which is what you actually read.
      - name: Keep what the failure looked like
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-gate-${{ matrix.shard }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # One job to make required. A matrix reports four check names that change
  # whenever the shard count does; this one is called `e2e gate` for good.
  gate:
    name: e2e gate
    runs-on: ubuntu-24.04
    needs: shard
    if: always()
    steps:
      - name: Say whether the shards passed
        run: |
          if [ "${{ needs.shard.result }}" != "success" ]; then
            echo "::error::a gate shard did not pass"
            exit 1
          fi
          echo "every gate shard passed"
