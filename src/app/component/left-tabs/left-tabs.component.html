<!-- The canvas is full bleed and this card floats over it, so it says which
     edge it takes: SvgGridService frames the linkage into what is left rather
     than into the window. A panel animated off screen reports a rect outside
     the canvas and so takes nothing. -->
<div
  [attr.data-canvas-inset]="viewport.isPhone() ? 'bottom' : 'left'"
  [@openClose]="
    this.tabs.isTabVisible() ? (this.tabs.isWidePanel() ? 'openWide' : 'open') : 'closed'
  "
  class="panel"
  [class.sheet]="viewport.isPhone()"
  [class.collapsed]="viewport.isPhone() && !sheetExpanded()"
  [class.analysis]="this.tabs.isAnalysisMode()"
  [class.behindDrawer]="drawerOpen"
>
  @if (this.tabs.getCurrentTab() === TabID.SYNTHESIZE) {
    <div class="page1">
      <app-synthesis-panel></app-synthesis-panel>
    </div>
  }
  @if (this.tabs.getCurrentTab() === TabID.EDIT) {
    <div class="page2">
      <app-edit-panel></app-edit-panel>
    </div>
  }
  @if (this.tabs.isAnalysisMode()) {
    <div class="page3">
      <app-analysis-panel></app-analysis-panel>
    </div>
  }
</div>

<!-- The sheet's own handle, on a phone only.
     Outside the panel rather than inside it, because the panel scrolls and a
     handle that scrolls away is a handle nobody can reach. It rides on the
     sheet's published height, so it sits on the sheet's top edge wherever that
     edge currently is. -->
@if (viewport.isPhone() && this.tabs.isTabVisible()) {
  <button
    class="sheetHandle"
    type="button"
    (click)="toggleSheet()"
    [attr.aria-expanded]="sheetExpanded()"
    [attr.aria-label]="sheetExpanded() ? 'Collapse the panel' : 'Expand the panel'"
  >
    <span class="sheetGrip"></span>
  </button>
}
