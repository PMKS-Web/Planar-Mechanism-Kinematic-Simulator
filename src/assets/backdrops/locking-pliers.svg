  <path class="edge" stroke-width="1.2" d="M859.3 91.8 L865.1 105.5"/>
  <path class="edge" stroke-width="1.2" d="M869.2 91.2 L875.1 104.9"/>
  <path class="edge" stroke-width="1.2" d="M879.2 90.6 L885.0 104.3"/>
  <path class="edge" stroke-width="1.2" d="M889.2 90.0 L895.0 103.7"/>
  <path class="edge" stroke-width="1.2" d="M899.2 89.4 L905.0 103.1"/>
  <path class="edge" stroke-width="1.2" d="M909.2 88.8 L915.0 102.5"/>
  <path class="edge" stroke-width="1.2" d="M919.1 88.2 L925.0 101.9"/>
  <path class="edge" stroke-width="1.2" d="M929.1 87.6 L935.0 101.3"/>
